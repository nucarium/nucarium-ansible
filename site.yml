---
# Builds a Nucarium box from a fresh Ubuntu Server install.
# Run on your workstation:  ansible-playbook site.yml
# One part only:            ansible-playbook site.yml --tags day2
- name: Build a Nucarium box
  hosts: boxes
  gather_facts: false
  become: false

  vars_files:
    - vars/sandbox.yml
    - vars/runtime.yml

  vars:
    # The nucleus: bare clones in .repos/, sessions in .worktrees/, seed
    # files in .seeds/. nucleate manages it; nucleated watches it.
    nucleus_root: "{{ agent_home }}/workspace"
    # One environment's Claude configuration folder, and the variable that
    # points Claude Code at it. Both are worked out inside a loop over
    # environments whose loop variable is env. The first login uses ~/.claude
    # and needs no variable.
    env_config_dir: "{{ env.config_dir | default(agent_home ~ '/.claude') }}"
    env_claude: "{{ {} if env_config_dir == agent_home ~ '/.claude' else {'CLAUDE_CONFIG_DIR': env_config_dir} }}"
    # The rest of one environment's settings, with their defaults: where it
    # runs (host or container), what its sandboxed commands may reach, the
    # hosts limited adds, its variables and its setup script.
    # tasks/check-environments.yml checks them first.
    env_runtime: "{{ env.runtime | default('host', true) }}"
    env_network: "{{ env.network | default('limited', true) }}"
    env_allowed_hosts: "{{ env.allowed_hosts | default([], true) }}"
    env_variables: "{{ env.variables | default({}, true) }}"
    env_setup_script: "{{ env.setup_script | default('', true) }}"
    # What only a container environment can have: its own repositories (the
    # box's repos when it has none), the names of its secret variables, its
    # own GitHub identity (empty: the box's), and its start script. The
    # folder of Git settings its container has at nucarium_box_dir: its own
    # with an identity of its own, else the box's.
    env_repos: "{{ env.repos if env.repos is defined else repos }}"
    env_secret_variables: "{{ env.secret_variables | default([], true) }}"
    env_github: "{{ env.github | default({}, true) }}"
    env_start_script: "{{ env.start_script | default('', true) }}"
    env_box_dir: "{{ nucarium_env_box_dir if env_github else nucarium_box_dir }}"
    # The unit that runs its agent server: on the host, or in its container.
    env_unit: "{{ 'agent-env-' ~ env.name ~ '.service' if env_runtime == 'container' else 'agent-server@' ~ env.name ~ '.service' }}"
    # Its nucleus: the shared one on the host; in a container, its own, which
    # is all its container mounts of the agent user's workspace.
    env_nucleus: "{{ agent_home ~ '/workspace-' ~ env.name if env_runtime == 'container' else nucleus_root }}"
    # Nucarium Watch is hosted only, so its address is not a setting.
    watch_console_url: https://app.nucarium.com
    # What box_notify_url may be: https, or http to the box itself, with no
    # username or password, and nothing that would break out of the quotes it
    # is written between in nucleated's configuration. No fragment either:
    # nucleated refuses one, and a config it refuses stops the whole daemon.
    notify_url_pattern: '^(https://[^\s"\\/?#@]+|http://(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?)([/?][^\s"\\#]*)?$'

  pre_tasks:
    - name: Check the settings
      ansible.builtin.assert:
        that:
          - environments | length > 0
          - environments | map(attribute='name') | unique | length == environments | length
          - environments | map(attribute='name') | select('match', '^[a-z0-9][a-z0-9-]*$') | length == environments | length
          - environments | map(attribute='config_dir', default='') | unique | length == environments | length
          - environments | map(attribute='config_dir', default='/') | select('match', '^/') | length == environments | length
          - watch_target in ['hosted', 'none']
          - hcp_mode in ['none', 'file', 'vault']
          - hcp_mode == 'none' or secret_refs.hcp_token | length > 0
          - hcp_mode != 'vault' or secret_refs.vault_read_token | length > 0
          - box_notify_url | default('', true) | trim == '' or box_notify_url | trim is match(notify_url_pattern)
        fail_msg: >-
          group_vars/all.yml: environments needs at least one entry, each
          with its own name (lower-case letters, digits and hyphens) and its
          own config_dir (a full path, or left out for the first login); watch_target is hosted or none; hcp_mode is none,
          file or vault, and file and vault need secret_refs.hcp_token (vault
          also secret_refs.vault_read_token); box_notify_url is empty or an
          https:// address (http:// only for localhost) with no username,
          password or #fragment in it.
        quiet: true
      tags: always

    - name: Check each environment's settings
      ansible.builtin.import_tasks: tasks/check-environments.yml
      tags: always

    - name: Read secrets from 1Password on the workstation
      ansible.builtin.set_fact:
        secrets: "{{ secrets | default({}) | combine({item.key: lookup('ansible.builtin.pipe', 'op read ' ~ (item.value | quote))}) }}"
      loop: "{{ secret_refs | dict2items | selectattr('value') | list }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true
      tags: always

    - name: Check each container environment's secret variables have values
      ansible.builtin.import_tasks: tasks/check-secret-variables.yml
      tags: always

    - name: Use the vault's sudo password
      ansible.builtin.set_fact:
        ansible_become_password: "{{ secrets.become_password }}"
      when: secrets.become_password is defined
      no_log: true
      tags: always

    - name: Gather facts
      ansible.builtin.setup:
      tags: always

    # The users role creates the agent user. On a run of one part (--tags)
    # that role is skipped, so the lookup happens here too.
    - name: Look up the agent user, if it exists yet
      ansible.builtin.import_tasks: tasks/agent-user.yml
      tags: always

    - name: Check the logins of container environments
      ansible.builtin.import_tasks: tasks/check-container-logins.yml
      when: agent_home is defined
      tags: always

    - name: Check the environments that have had a GitHub identity of their own
      ansible.builtin.import_tasks: tasks/check-github-environments.yml
      tags: always

  roles:
    - role: base
      become: true
      tags: base
    - role: tpm
      become: true
      tags: tpm
    - role: network
      become: true
      tags: network
    - role: nut
      become: true
      when: nut_enabled
      tags: nut
    - role: users
      become: true
      tags: users
    - role: toolchain
      become: true
      tags: toolchain
    - role: cloud_parity
      become: true
      tags: cloud_parity
    - role: broker
      become: true
      tags: broker
    - role: claude
      become: true
      tags: claude
    - role: workspace
      become: true
      tags: workspace
    # Before env_setup: a container environment's setup script is built into
    # its image, on its network, from its base, and env_setup starts that
    # build when any of them has changed.
    - role: env_runtime
      become: true
      tags: env_runtime
    - role: env_setup
      become: true
      tags: env_setup
    - role: env_runtime
      become: true
      tags: env_runtime
    - role: agent_servers
      become: true
      tags: agent_servers
    - role: day2
      become: true
      tags: day2

  post_tasks:
    - name: What is left to do by hand
      ansible.builtin.debug:
        msg: "{{ lookup('ansible.builtin.template', 'templates/next-steps.j2') | trim | split('\n') }}"
      tags: always
