---
# The nucleus is the workspace folder: bare clones in .repos/, one folder per
# session in .worktrees/, seed files in .seeds/. nucleate builds and manages
# it; this role only says where it is and which repositories it offers.
- name: The nucleus, for the agent user
  become: true
  become_user: "{{ agent_user }}"
  environment:
    PATH: "{{ agent_home }}/.local/bin:{{ agent_home }}/.local/share/fnm/aliases/default/bin:/usr/local/go/bin:/usr/local/bin:/usr/bin:/bin"
  block:
    - name: Create the nucleus
      ansible.builtin.command: nucleate init --root {{ nucleus_root }}
      args:
        creates: "{{ nucleus_root }}/.repos"

    - name: Create the folders the recipe adds to it
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ nucleus_root }}/.seeds"
        - "{{ nucleus_root }}/.claude"
        - "{{ agent_home }}/.config/nucleate"

    - name: Point nucleate at the nucleus and the broker's GitHub token
      ansible.builtin.template:
        src: nucleate-config.toml.j2
        dest: "{{ agent_home }}/.config/nucleate/config.toml"
        mode: "0644"

    - name: Register the worktree hooks at the nucleus root
      ansible.builtin.copy:
        src: nucleus-settings.json
        dest: "{{ nucleus_root }}/.claude/settings.json"
        mode: "0644"

    # Written in place, never replaced, so that a container environment's
    # read-only mount of it stays on this file and sees the new text from its
    # next start (a replaced file would leave the mount on the old one).
    - name: Look at the nucleus instructions on the box
      ansible.builtin.stat:
        path: "{{ nucleus_root }}/AGENTS.md"
        checksum_algorithm: sha1
      register: workspace_agents_md
      when: (playbook_dir ~ '/agent-context/AGENTS.md') is file

    - name: Remove a link where the instructions belong
      ansible.builtin.file:
        path: "{{ nucleus_root }}/AGENTS.md"
        state: absent
      when:
        - workspace_agents_md is not skipped
        - workspace_agents_md.stat.islnk | default(false)

    - name: Install the nucleus instructions
      ansible.builtin.command:
        argv: [sh, -c, 'cat > "$1"', sh, "{{ nucleus_root }}/AGENTS.md"]
        stdin: "{{ workspace_agents_source }}"
        stdin_add_newline: false
      vars:
        workspace_agents_source: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/agent-context/AGENTS.md', rstrip=false) }}"
      changed_when: true
      when:
        - workspace_agents_md is not skipped
        - workspace_agents_md.stat.islnk | default(false) or workspace_agents_md.stat.checksum | default('') != workspace_agents_source | hash('sha1')

    # A container environment gets these read-only and does not start without
    # them (nucarium_nucleus_protected), so that it cannot plant what the
    # host's environments would read: empty ones when you have none.
    - name: Make sure the nucleus has the files container environments need
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ nucleus_root }}/{{ item.path }}"
        mode: "0644"
        force: false
      loop:
        - path: AGENTS.md
          content: ""
        - path: CLAUDE.md
          content: ""
        - path: .mcp.json
          content: "{\"mcpServers\": {}}\n"
      loop_control:
        label: "{{ item.path }}"
      when: nucarium_container_envs | length > 0

    # An entry with a slash names its owner (other-org/tools); a bare name
    # belongs to github_org. Sessions see each repo under its GitHub slug.
    - name: Make each repository available
      ansible.builtin.command: >-
        nucleate clone
        https://github.com/{{ item if '/' in item else github_org ~ '/' ~ item }}.git
      args:
        creates: "{{ nucleus_root }}/.repos/{{ item | basename }}.git"
      loop: "{{ repos }}"

    - name: Fetch every repository
      ansible.builtin.command: nucleate refresh
      changed_when: false

    # User scope, once per Claude login: a session's own folder is
    # .worktrees/<session>/, where project-level MCP settings are not found.
    # Only for the logins on the host: claude mcp get starts the servers a
    # login names, and a container environment's login is the container's
    # to write, so it is never run here. Its agent server registers the
    # server itself, inside its container, at every start.
    - name: Check whether each login has the nucleate MCP server
      ansible.builtin.command: claude mcp get nucleate
      environment: "{{ env_claude }}"
      loop: "{{ environments | rejectattr('name', 'in', nucarium_container_envs) | list }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}"
      register: workspace_mcp
      check_mode: false
      changed_when: false
      failed_when: false

    - name: Drop a registration that points at an earlier nucleate
      ansible.builtin.command: claude mcp remove --scope user nucleate
      environment: "{{ env_claude }}"
      vars:
        env: "{{ found.env }}"
      loop: "{{ workspace_mcp.results }}"
      loop_control:
        loop_var: found
        label: "{{ found.env.name }}"
      changed_when: true
      when:
        - found.rc == 0
        - (agent_home ~ '/.local/bin/nucleate mcp') not in found.stdout

    - name: Register the nucleate MCP server for each login
      ansible.builtin.command: >-
        claude mcp add --scope user nucleate -- {{ agent_home }}/.local/bin/nucleate mcp
      environment: "{{ env_claude }}"
      vars:
        env: "{{ found.env }}"
      loop: "{{ workspace_mcp.results }}"
      loop_control:
        loop_var: found
        label: "{{ found.env.name }}"
      changed_when: true
      when: found.rc != 0 or (agent_home ~ '/.local/bin/nucleate mcp') not in found.stdout
