---
# Each environment's variables, its setup script, where it runs, and the
# summary nucleated reports. On the host, its network is in its Claude Code
# settings (the claude role); in a container, its proxy's rules (the
# env_runtime role).

- name: Create the folders for the environments
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ env_setup_etc_dir | dirname }}"
    - "{{ env_setup_etc_dir }}"
    - "{{ env_setup_state_dir | dirname }}"
    - "{{ env_setup_state_dir }}"

- name: Create a folder for each environment
  ansible.builtin.file:
    path: "{{ env_setup_etc_dir }}/{{ env.name }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ environments }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

# Not secret: anything in group_vars/all.yml is the agent's to read. Root's,
# so that no command an agent runs can change what its next session runs.
- name: Write each environment's variables
  ansible.builtin.template:
    src: variables.sh.j2
    dest: "{{ env_setup_etc_dir }}/{{ env.name }}/variables.sh"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  register: env_setup_variables

# The secret variables of each environment on the host (secret_variables),
# whose values are environment_secrets.<env>.<NAME>, which
# tasks/check-secret-variables.yml made sure of before anything changed.
# Root's, in root's folder, so that no command an agent runs can change it;
# read by the agent user through its group, since the session hook runs as
# that user, and by nobody else. Shell-quoted, as the variables are. Written
# beside its place and renamed into it, and never logged. A container
# environment has its secret variables as Podman secrets (the env_runtime
# role) and none here: its container has this folder mounted.
- name: Write the secret variables of each environment on the host
  ansible.builtin.template:
    src: secret-variables.sh.j2
    dest: "{{ env_setup_etc_dir }}/{{ env.name }}/{{ nucarium_host_secrets_file }}"
    owner: root
    group: "{{ agent_user }}"
    mode: "0640"
  loop: "{{ environments | selectattr('name', 'in', nucarium_host_secret_envs) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  no_log: true

# One that lists none any more, or has moved into a container. The folder of
# an environment that is gone is removed whole, below.
- name: Remove the secret variables of each environment that has none on the host
  ansible.builtin.file:
    path: "{{ env_setup_etc_dir }}/{{ env.name }}/{{ nucarium_host_secrets_file }}"
    state: absent
  loop: "{{ environments | rejectattr('name', 'in', nucarium_host_secret_envs) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

# host or container. Read by the setup runner, and by both agent server
# units of the environment, so that only the one it names runs
# (agent-server-runtime, the agent_servers role).
- name: Write where each environment runs
  ansible.builtin.copy:
    content: "{{ env_runtime }}\n"
    dest: "{{ env_setup_etc_dir }}/{{ env.name }}/runtime"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  register: env_setup_runtimes

# Once a login has been a container's, the host never uses it again
# (tasks/check-container-logins.yml): one file per login, named after the
# hash of its config_dir and holding the path. Kept when the environment is
# removed or renamed.
- name: Create the record of the logins container environments have used
  ansible.builtin.file:
    path: "{{ nucarium_container_logins_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: nucarium_container_envs | length > 0

- name: Record each container environment's login
  ansible.builtin.copy:
    content: "{{ env.config_dir }}\n"
    dest: "{{ nucarium_container_logins_dir }}/{{ env.config_dir | hash('sha256') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments | selectattr('name', 'in', nucarium_container_envs) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

# Once an environment has had a GitHub identity of its own, the host's
# sandboxes never read its nucleus or login, and no environment without one
# takes its name or login (tasks/check-github-environments.yml): one file
# per name and config_dir, holding them and the nucleus. Kept when the
# environment is removed or renamed, as its nucleus and login are.
- name: Create the record of the environments with a GitHub identity of their own
  ansible.builtin.file:
    path: "{{ nucarium_github_envs_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: environments | selectattr('github', 'defined') | list | length > 0

- name: Record each of them
  ansible.builtin.copy:
    content: "{{ {'name': env.name, 'nucleus': env_nucleus, 'config_dir': env.config_dir} | to_json }}\n"
    dest: "{{ nucarium_github_envs_dir }}/{{ [env.name, env.config_dir] | to_json | hash('sha256') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments | selectattr('name', 'in', nucarium_container_envs) | selectattr('github', 'defined') | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

- name: What a container environment's image is built from
  ansible.builtin.import_tasks: container.yml

- name: Install the setup-script runner
  ansible.builtin.copy:
    src: nucarium-env-setup
    dest: /usr/local/sbin/nucarium-env-setup
    owner: root
    group: root
    mode: "0755"

- name: Install the setup-script unit
  ansible.builtin.template:
    src: nucarium-env-setup@.service.j2
    dest: /etc/systemd/system/nucarium-env-setup@.service
    owner: root
    group: root
    mode: "0644"
  register: env_setup_unit

- name: Store each environment's setup script
  ansible.builtin.copy:
    content: "{{ env_setup_script }}"
    dest: "{{ env_setup_etc_dir }}/{{ env.name }}/setup.sh"
    owner: root
    group: root
    mode: "0700"
  loop: "{{ environments | selectattr('setup_script', 'defined') | selectattr('setup_script') | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  register: env_setup_scripts

# A container environment's start script, which its agent server runs as
# root inside the container at each start (agent-server). Readable by all:
# the container's root is the agent user on the box, and it is not secret.
# It is no part of the image, so a change reaches the container at its next
# start, with no build.
- name: Store each container environment's start script
  ansible.builtin.copy:
    content: "{{ env_start_script }}"
    dest: "{{ env_setup_etc_dir }}/{{ env.name }}/start.sh"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments | selectattr('name', 'in', nucarium_container_envs) | selectattr('start_script', 'defined') | selectattr('start_script') | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  register: env_setup_start_scripts

- name: Remove the start script of each environment that no longer has one
  ansible.builtin.file:
    path: "{{ env_setup_etc_dir }}/{{ env.name }}/start.sh"
    state: absent
  loop: "{{ environments | rejectattr('name', 'in', env_setup_start_scripts.results | map(attribute='env.name') | list) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

- name: Remove the setup script of each environment that no longer has one
  ansible.builtin.file:
    path: "{{ env_setup_etc_dir }}/{{ env.name }}/setup.sh"
    state: absent
  loop: "{{ environments | rejectattr('name', 'in', env_setup_scripts.results | map(attribute='env.name') | list) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  register: env_setup_removed

# At every boot, and now when what it does has changed. Without waiting: a
# script may take its full 30 minutes, and nucleated reports how it went.
#
# On the host the unit runs the script, so it is there for an environment
# that has one, and runs again when the script changes. In a container it
# builds the environment's image (see nucarium-env-setup), so it is there
# for every container environment, script or not, and runs again when the
# script, the variables, the base image or the network changes; a run with
# nothing changed builds nothing. Either way it runs again when the
# environment moves between the host and a container.
#
# None of this touches an agent server or a session: those are the agent
# user's own units. On the host their start script only waits for a script
# that is running when the server starts; a container starts from the image
# built last, and a new one is used from its next start.
- name: Run each environment's setup when it has changed, and at every boot
  ansible.builtin.systemd_service:
    name: nucarium-env-setup@{{ env.name }}.service
    enabled: true
    state: "{{ 'restarted' if env_setup_changed else omit }}"
    no_block: true
    daemon_reload: "{{ env_setup_unit is changed }}"
  loop: "{{ environments | selectattr('name', 'in', env_setup_runs) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"
  vars:
    # What the run depends on: on the host the script; in a container also
    # the runtime, the variables, the base image and the network.
    env_setup_inputs: >-
      {{ env_setup_scripts.results
      + ((env_setup_runtimes.results + env_setup_variables.results + env_setup_image_env.results
          + env_setup_network_env.results + env_runtime_proxy_rules_written.results | default([]))
         if env_runtime == 'container' else []) }}
    # An environment just back on the host from a container has its image's
    # files removed (tasks/container.yml), and its script runs on the host.
    env_setup_back_on_host: "{{ env_setup_left_container.results | selectattr('item.0.name', 'equalto', env.name) | select('changed') | list }}"
    env_setup_changed: >-
      {{ (env_setup_inputs | selectattr('env.name', 'equalto', env.name) | select('changed') | list
      + env_setup_back_on_host) | length > 0 }}

- name: Stop running it for each environment on the host with no script
  ansible.builtin.systemd_service:
    name: nucarium-env-setup@{{ env.name }}.service
    enabled: false
    state: stopped
  loop: "{{ environments | rejectattr('name', 'in', env_setup_runs) | list }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

- name: Forget how it last ran
  ansible.builtin.file:
    path: "{{ env_setup_state_dir }}/{{ item.env.name }}.setup.json"
    state: absent
  loop: "{{ env_setup_removed.results }}"
  loop_control:
    label: "{{ item.env.name }}"

# Copied to a temporary file in the same folder and renamed into place, so
# nucleated never reads half of one.
- name: Write what each environment is, for nucleated to report
  ansible.builtin.copy:
    content: "{{ env_setup_summary | to_nice_json }}\n"
    dest: "{{ env_setup_state_dir }}/{{ env.name }}.json"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ environments }}"
  loop_control:
    loop_var: env
    label: "{{ env.name }}"

- name: List the environments set up on the box
  ansible.builtin.find:
    paths:
      - "{{ env_setup_etc_dir }}"
      - "{{ env_setup_state_dir }}"
    file_type: any
  register: env_setup_found

- name: Remove environments that are no longer in the settings
  vars:
    env_setup_gone: >-
      {{ env_setup_found.files | map(attribute='path') | map('basename')
      | map('regex_replace', '(\.setup)?\.json$', '') | unique
      | difference(environments | map(attribute='name')) }}
  block:
    - name: Stop running their setup scripts
      ansible.builtin.systemd_service:
        name: nucarium-env-setup@{{ item }}.service
        enabled: false
        state: stopped
      loop: "{{ env_setup_gone }}"

    - name: Remove their scripts, variables and summaries
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ env_setup_gone | map('regex_replace', '^(.*)$', env_setup_etc_dir ~ '/\1') | list
        + env_setup_gone | map('regex_replace', '^(.*)$', env_setup_state_dir ~ '/\1.json') | list
        + env_setup_gone | map('regex_replace', '^(.*)$', env_setup_state_dir ~ '/\1.setup.json') | list
        + env_setup_gone | map('regex_replace', '^(.*)$', env_setup_build_dir ~ '/\1') | list }}
