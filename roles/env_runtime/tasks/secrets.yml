---
# Each container environment's secret variables (secret_variables), as the
# agent user's Podman secrets nucarium-env-<env>-<name> (nucarium_env_secrets
# in vars/runtime.yml), which its container's unit gives its processes as
# those variables (Secret= in agent-env.container.j2): in no unit file, on no
# command line, and not in the image. The values are
# environment_secrets.<env>.<NAME> (nucarium_environment_secrets), which
# tasks/check-secret-variables.yml made sure of before anything changed. A
# changed value reaches a container at its next start. Every other
# nucarium-env-* secret is removed: those of a variable no longer listed, and
# of an environment that is gone or no longer in a container.
- name: The secret variables, as Podman secrets of the agent user
  become: true
  become_user: "{{ agent_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ agent_uid }}
  vars:
    env_runtime_secret_names: "{{ env_runtime_secrets_present.stdout_lines | select('match', '^' ~ (nucarium_env_secret_prefix | regex_escape)) | list }}"
  block:
    - name: List the ones there are
      ansible.builtin.command:
        argv: [podman, secret, ls, --noheading, --format, "{{ '{{' }}.Name{{ '}}' }}"]
      register: env_runtime_secrets_present
      changed_when: false
      check_mode: false

    - name: Read each one still listed
      ansible.builtin.command:
        argv: [podman, secret, inspect, --showsecret, "{{ item.secret }}"]
      loop: "{{ nucarium_env_secrets | selectattr('secret', 'in', env_runtime_secret_names) | list }}"
      loop_control:
        label: "{{ item.secret }}"
      register: env_runtime_secrets_read
      changed_when: false
      check_mode: false
      no_log: true

    - name: Store each one that is new or has changed
      ansible.builtin.command:
        argv: [podman, secret, create, --replace, "{{ item.secret }}", "-"]
        stdin: "{{ nucarium_environment_secrets[item.env][item.name] }}"
        stdin_add_newline: false
      loop: "{{ nucarium_env_secrets }}"
      loop_control:
        label: "{{ item.secret }}"
      changed_when: true
      no_log: true
      when: >-
        item.secret not in env_runtime_secrets_read.results | map(attribute='item.secret') | list
        or (env_runtime_secrets_read.results | selectattr('item.secret', 'equalto', item.secret) | first).stdout
        | from_json | map(attribute='SecretData') | first != nucarium_environment_secrets[item.env][item.name]

    - name: Remove the ones no environment lists
      ansible.builtin.command:
        argv: [podman, secret, rm, "{{ item }}"]
      loop: "{{ env_runtime_secret_names | difference(nucarium_env_secrets | map(attribute='secret')) }}"
      changed_when: true
