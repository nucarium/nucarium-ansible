---
# What builds a container environment's image, and the box's own Git and
# npm settings its containers use. Only on a box with a container
# environment.

# The image's builder is the agent user's: its units run in the agent user's
# own manager, which the root runner nucarium-env-setup starts them in.
- name: The image builder, for the agent user
  become: true
  become_user: "{{ agent_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ agent_uid }}
  block:
    - name: Create the folders for the builder and its units
      ansible.builtin.file:
        path: "{{ agent_home }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - .local/bin
        - .config/systemd/user

    - name: Install the image builder
      ansible.builtin.copy:
        src: build/nucarium-env-build
        dest: "{{ agent_home }}/.local/bin/nucarium-env-build"
        mode: "0755"

    - name: Install its units
      ansible.builtin.copy:
        src: build/{{ item }}
        dest: "{{ agent_home }}/.config/systemd/user/{{ item }}"
        mode: "0644"
      loop:
        - nucarium-env-build@.service
        - nucarium-env-check@.service

    - name: Reload the agent user's units
      ansible.builtin.systemd_service:
        scope: user
        daemon_reload: true

# Root's, so that nothing in a container rewrites how the box signs or what
# it authenticates as. Mounted read-only into every container environment
# at the same path; the base image's /root/.gitconfig includes gitconfig. The
# key and the token are the agent user's to read, as on the box itself:
# inside a container the agent user is root.
- name: Create the folder of the box's Git and npm settings
  ansible.builtin.file:
    path: "{{ nucarium_box_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the box's Git settings
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ nucarium_box_dir }}/gitconfig"
    owner: root
    group: root
    mode: "0644"

# The key the toolchain role made for the box, whose public half is
# registered on GitHub for signing. It is in the agent user's home, where an
# agent can put a link in its place, so it is read as the agent user: a link
# to a file only root reads (the GitHub App's key, say) is refused, where
# root would copy it to a file the agent user owns. A few seconds and a few
# kilobytes at most, so that a pipe or an endless file there holds nothing
# up. Root writes it into root's folder, beside the old one and then in its
# place. All of it on the box: the key is never sent to your workstation.
- name: Copy the commit-signing key pair
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    new=$(mktemp "$KEY_DEST.XXXXXX")
    trap 'rm -f "$new"' EXIT
    timeout 10 runuser -u "$KEY_READER" -- head -c 16384 -- "$KEY_SRC" > "$new"
    test -s "$new"
    chown "$KEY_OWNER:$KEY_OWNER" "$new"
    chmod "$KEY_MODE" "$new"
    if ! cmp -s "$new" "$KEY_DEST"; then
      mv -f "$new" "$KEY_DEST"
      echo copied
    fi
    chown "$KEY_OWNER:$KEY_OWNER" "$KEY_DEST"
    chmod "$KEY_MODE" "$KEY_DEST"
  args:
    executable: /bin/bash
  environment:
    KEY_READER: "{{ agent_user }}"
    KEY_SRC: "{{ agent_home }}/.ssh/id_ed25519_signing{{ item.suffix }}"
    KEY_DEST: "{{ nucarium_box_dir }}/signing{{ item.suffix }}"
    KEY_OWNER: "{{ item.owner }}"
    KEY_MODE: "{{ item.mode }}"
  register: env_runtime_signing_copied
  changed_when: "'copied' in env_runtime_signing_copied.stdout"
  loop:
    - suffix: ""
      owner: "{{ agent_user }}"
      mode: "0600"
    - suffix: .pub
      owner: root
      mode: "0644"
  loop_control:
    label: signing{{ item.suffix }}

# A container environment with a GitHub identity of its own (github on the
# environment) uses none of the box's: its container has this folder,
# laid out like the box's, at the same path in place of it. Its Git
# identity, commit signing with a key of its own, a credential helper that
# answers with the environment's own GITHUB_TOKEN (a secret variable), and
# that token as a file.
# No packages token: one it needs is its own NODE_AUTH_TOKEN.
- name: The Git settings of each environment with a GitHub identity of its own
  vars:
    env_runtime_identity_envs: "{{ environments | selectattr('name', 'in', env_runtime_container_envs) | selectattr('github', 'defined') | list }}"
    # The setups whose environments have a GitHub identity: they sign with
    # one key, the setup's, so that it is registered once for all its logins.
    env_runtime_identity_setups: "{{ env_runtime_identity_envs | selectattr('setup', 'defined') | map(attribute='setup') | unique | list }}"
    # In a dry run (--check), the setups whose key would be made by this run
    # and so is not there to copy, own or fetch.
    env_runtime_setups_unmade: "{{ env_runtime_setup_keygen.results | default([]) | selectattr('changed') | map(attribute='item') | list if ansible_check_mode else [] }}"
  block:
    - name: Create its folder
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ env_runtime_identity_envs | map(attribute='name') | map('regex_replace', '^(.*)$', '/etc/nucarium/environments/\\1') | product(['', '/box']) | map('join') | list }}"

    - name: Write its Git settings
      ansible.builtin.template:
        src: gitconfig.j2
        dest: "{{ nucarium_env_box_dir }}/gitconfig"
        owner: root
        group: root
        mode: "0644"
      vars:
        env_runtime_git_for: environment {{ env.name }}, which has a GitHub identity of its own
        env_runtime_git_identity: "{{ env.github }}"
        env_runtime_git_helper: "{{ nucarium_env_git_credential_helper }}"
      loop: "{{ env_runtime_identity_envs }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}"

    # Made once and never replaced: its public half is registered on the
    # environment's GitHub account. An environment of a setup gets the
    # setup's key instead, below.
    - name: Create its commit-signing key
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ inventory_hostname }}-{{ env.name }} agent signing", -f, "{{ nucarium_env_box_dir }}/signing"]
        creates: "{{ nucarium_env_box_dir }}/signing"
      loop: "{{ env_runtime_identity_envs | rejectattr('setup', 'defined') | list }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}"

    # A setup's key, in a folder only root reads, made once and never
    # replaced, as an environment's is.
    - name: Create the folder of each setup's key
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      loop: "{{ [nucarium_setups_dir] + env_runtime_identity_setups | map('regex_replace', '^', nucarium_setups_dir ~ '/') | list }}"

    - name: Create each setup's commit-signing key
      ansible.builtin.command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ inventory_hostname }}-{{ item }} agent signing", -f, "{{ nucarium_setups_dir }}/{{ item }}/signing"]
        creates: "{{ nucarium_setups_dir }}/{{ item }}/signing"
      loop: "{{ env_runtime_identity_setups }}"
      register: env_runtime_setup_keygen

    # Copied over on every run, so that every environment of the setup signs
    # with the same key.
    - name: Give each environment of a setup the setup's key
      ansible.builtin.copy:
        src: "{{ nucarium_setups_dir }}/{{ outer.0.setup }}/signing{{ outer.1 }}"
        dest: "{{ nucarium_env_box_dir }}/signing{{ outer.1 }}"
        remote_src: true
        force: true
        mode: preserve
      vars:
        env: "{{ outer.0 }}"
      loop: "{{ env_runtime_identity_envs | selectattr('setup', 'defined') | product(['', '.pub']) | list }}"
      when: outer.0.setup not in env_runtime_setups_unmade
      loop_control:
        loop_var: outer
        label: "{{ outer.0.name }}: signing{{ outer.1 }}"

    # As the box's pair: the key the agent user's, which is root in the
    # container, and the public half root's.
    - name: Give its key pair its owners
      ansible.builtin.file:
        path: "{{ nucarium_env_box_dir }}/signing{{ outer.1.suffix }}"
        owner: "{{ outer.1.owner }}"
        group: "{{ outer.1.owner }}"
        mode: "{{ outer.1.mode }}"
      vars:
        env: "{{ outer.0 }}"
      loop: >-
        {{ env_runtime_identity_envs | product([{'suffix': '', 'owner': agent_user, 'mode': '0600'},
        {'suffix': '.pub', 'owner': 'root', 'mode': '0644'}]) | list }}
      when: outer.0.setup is not defined or outer.0.setup not in env_runtime_setups_unmade
      loop_control:
        loop_var: outer
        label: "{{ outer.0.name }}: signing{{ outer.1.suffix }}"

    # Its GITHUB_TOKEN as a file, for nucleate in the container and
    # nucleated on the host (github_token_file in their configuration), the
    # agent user's to read: the same path in both. Removed with the
    # environment's folder.
    - name: Write its GitHub token
      ansible.builtin.copy:
        content: "{{ nucarium_environment_secrets[env.name].GITHUB_TOKEN }}"
        dest: "{{ nucarium_env_github_token_file }}"
        owner: "{{ agent_user }}"
        group: "{{ agent_user }}"
        mode: "0600"
      loop: "{{ env_runtime_identity_envs }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}"
      no_log: true

    # For the closing message: register it as a signing key on the
    # environment's GitHub account, once for each setup.
    - name: Copy its public key to the workstation
      ansible.builtin.fetch:
        src: "{{ nucarium_env_box_dir }}/signing.pub"
        dest: "{{ playbook_dir }}/out/{{ inventory_hostname }}-{{ env.name }}-signing.pub"
        flat: true
      loop: "{{ env_runtime_identity_envs | rejectattr('setup', 'defined') | list }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}"

    - name: Copy each setup's public key to the workstation
      ansible.builtin.fetch:
        src: "{{ nucarium_setups_dir }}/{{ item }}/signing.pub"
        dest: "{{ playbook_dir }}/out/{{ inventory_hostname }}-{{ item }}-signing.pub"
        flat: true
      loop: "{{ env_runtime_identity_setups }}"
      when: item not in env_runtime_setups_unmade

# A setup none of whose environments has a GitHub identity any more loses
# its key, as a removed environment loses its folder.
- name: List the setups' keys on the box
  ansible.builtin.find:
    paths: "{{ nucarium_setups_dir }}"
    file_type: directory
  register: env_runtime_setup_keys

- name: Remove the keys of setups that no longer have a GitHub identity
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ env_runtime_setup_keys.files | map(attribute='path')
    | reject('in', environments | selectattr('name', 'in', env_runtime_container_envs) | selectattr('github', 'defined')
      | selectattr('setup', 'defined') | map(attribute='setup') | map('regex_replace', '^', nucarium_setups_dir ~ '/') | list) | list }}

- name: Write the GitHub Packages token (download-only)
  ansible.builtin.copy:
    dest: "{{ nucarium_box_dir }}/npmrc"
    content: |
      @{{ github_org }}:registry=https://npm.pkg.github.com
      //npm.pkg.github.com/:_authToken={{ secrets.npm_token }}
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0600"
  no_log: true
  when: secrets.npm_token is defined

- name: Remove it when there is none
  ansible.builtin.file:
    path: "{{ nucarium_box_dir }}/npmrc"
    state: absent
  when: secrets.npm_token is not defined

# The same token as the agent user's Podman secret, which each container
# environment's unit gives its processes as NODE_AUTH_TOKEN (Secret= in
# agent-env.container.j2): in no unit file, on no command line, and not in
# the image. A changed token reaches a container at its next start.
- name: The GitHub Packages token as a Podman secret, for the agent user
  become: true
  become_user: "{{ agent_user }}"
  environment:
    XDG_RUNTIME_DIR: /run/user/{{ agent_uid }}
  block:
    - name: Read the one there is
      ansible.builtin.command: podman secret inspect --showsecret {{ nucarium_npm_secret }}
      register: env_runtime_npm_secret
      changed_when: false
      failed_when: false
      check_mode: false
      no_log: true

    - name: Store the token
      ansible.builtin.command:
        argv: [podman, secret, create, --replace, "{{ nucarium_npm_secret }}", "-"]
        stdin: "{{ secrets.npm_token }}"
        stdin_add_newline: false
      changed_when: true
      no_log: true
      when:
        - secrets.npm_token is defined
        - env_runtime_npm_secret.rc != 0 or (env_runtime_npm_secret.stdout | from_json | first).SecretData != secrets.npm_token

    - name: Remove it when there is none
      ansible.builtin.command: podman secret rm {{ nucarium_npm_secret }}
      changed_when: true
      when: secrets.npm_token is not defined and env_runtime_npm_secret.rc == 0
