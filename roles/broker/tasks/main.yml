---
# The broker user holds the long-lived secrets, and writes what the agents
# get of them to /run/agent-tokens: the GitHub App's one-hour tokens, each
# for named repositories and permissions (vars/runtime.yml), and never the
# App's key.

# An earlier copy of the recipe also handed the agents a long-lived Terraform
# token. A box built with it still has the token and what fetched it; they
# are stopped and removed (vars/main.yml). The terraform package stays.
- name: Find the Terraform token's units
  ansible.builtin.stat:
    path: /etc/systemd/system/{{ item }}
  loop: "{{ broker_retired_units }}"
  register: broker_retired

- name: Stop them
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  loop: "{{ broker_retired.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Remove their units
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item }}
    state: absent
  loop: "{{ broker_retired_units }}"
  register: broker_retired_removed

- name: Have systemd forget them  # noqa: no-handler
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: broker_retired_removed is changed

- name: Find the copies of the token each environment was handed
  ansible.builtin.find:
    paths: "{{ nucarium_env_tokens_dir }}"
    patterns: "{{ broker_retired_token_names }}"
    recurse: true
    depth: 2
  register: broker_retired_given

- name: Remove the token, its copies and what fetched it
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ broker_retired_files + broker_retired_given.files | map(attribute='path') | list }}"

- name: GitHub App token
  when: secrets.github_app_pem is defined
  block:
    - name: Install the GitHub App private key
      ansible.builtin.copy:
        dest: /etc/agent-broker/github-app.pem
        content: "{{ secrets.github_app_pem | trim }}\n"
        owner: broker
        group: broker
        mode: "0600"
      no_log: true

    - name: Install the token minter
      ansible.builtin.template:
        src: agent-github-token.j2
        dest: /usr/local/sbin/agent-github-token
        mode: "0755"

    - name: Install the minter's service and timer
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        mode: "0644"
      loop:
        - agent-github-token.service
        - agent-github-token.timer

    - name: Start the 20-minute refresh
      ansible.builtin.systemd_service:
        name: agent-github-token.timer
        enabled: true
        state: started
        daemon_reload: true

    - name: Mint a token now
      ansible.builtin.systemd_service:
        name: agent-github-token.service
        state: started
      changed_when: false
