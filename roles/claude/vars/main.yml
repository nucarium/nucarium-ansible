---
# nucleated's hook entry point, registered as `nucleated hooks print --env
# <name>` prints it. It writes an allowlist of fields to a local spool, prints
# nothing and exits 0 within two seconds whatever happens, so it can never
# hold a session up. SessionEnd alone is not async, so the event is written
# before the session's process goes away.
#
# On the host, from the agent user's home. In a container, HOME is /root and
# the box's ~/.local/bin is mounted at its own path, so the path is written
# out; nucleated's config sync owns both forms.
claude_nucleated_hook: "{{ agent_home ~ '/.local/bin/nucleated hook' if env_runtime == 'container' else '$HOME/.local/bin/nucleated hook' }}"

# The SessionStart hook that adds the box's and the environment's variables
# to every session: root's, so that no session can change what the next one
# starts with, and at the same path in every container environment.
claude_session_env: "{{ nucarium_lib_dir }}/session-env.sh"

# The notifications that change what a session is waiting for.
claude_nucleated_notifications:
  - permission_prompt
  - idle_prompt
  - agent_needs_input
  - elicitation_dialog
  - elicitation_url_dialog
  - elicitation_complete
  - elicitation_response

# A session's worktree keeps its git data in the bare repository, outside the
# session folder, so the sandbox lets agents write to .repos/. Each bare
# repository's hooks and config stay read-only: nucleated runs git there
# outside the sandbox, and a hook or a setting such as core.fsmonitor,
# core.sshCommand or core.hooksPath would let an agent's command run
# unconfined. Both places nucleate keeps a clone are named: in its owner's
# folder (nucleate 0.12.0 on), and at .repos/<name>.git (before it).
claude_sandbox_deny_write: >-
  {{ ((repos | map('regex_replace', '^([^/]+)$', github_org ~ '/\1') | list) + (repos | map('basename') | list))
  | product(['hooks', 'config']) | map('join', '.git/')
  | map('regex_replace', '^', nucleus_root ~ '/.repos/') | list }}

# Where sandboxed commands may write besides the session folder: the nucleus,
# the agent folders in vars/sandbox.yml, the temp folders and pnpm's lock
# folders in the agent user's runtime folder (made at login by the
# cloud_parity role). Nothing else in the home is writable.
claude_pnpm_lock_dirs:
  - /run/user/{{ agent_uid }}/pnpm-dir-locks-{{ agent_uid }}
  - /run/user/{{ agent_uid }}/pnpm-modules-swaps-{{ agent_uid }}
  - /run/user/{{ agent_uid }}/pnpm-store-operation-locks-{{ agent_uid }}
claude_sandbox_allow_write: >-
  {{ [nucleus_root] + (sandbox_agent_dirs | map('regex_replace', '^', '~/') | list)
  + ['/tmp', '/var/tmp'] + claude_pnpm_lock_dirs }}
claude_sandbox_deny_in_allowed: >-
  {{ sandbox_agent_dirs_protected | map('regex_replace', '^', '~/') | list }}

# The nucleus is writable, and every later session and the agent server read
# these at its root as instructions, or run them as hooks and MCP servers:
# .claude, .seeds, .mcp.json, AGENTS.md and CLAUDE.md. Read-only to sandboxed
# commands, as a container environment has them in its own nucleus (the same
# list, nucarium_nucleus_protected in vars/runtime.yml). The workspace role
# makes each of them, since the sandbox can only hold what is there when a
# session starts. nucleate's MCP server and hooks, and Claude Code itself,
# run outside the sandbox and still write them.
claude_sandbox_deny_nucleus: >-
  {{ nucarium_nucleus_protected | map('regex_replace', '^', nucleus_root ~ '/') | list }}

# What sandboxed commands on the host may not read: what container
# environments hold that may belong to another owner. Each one's own Git
# settings, signing key and GitHub token (/etc/nucarium/environments/<name>/box/,
# a glob the sandbox expands as a session starts, so a folder made later is
# covered from the next session); the signing keys of setups
# (nucarium_setups_dir), each shared by a setup's environments, which are
# root's anyway; the agent user's Podman storage, whose
# secrets/ holds every container environment's secret variables
# (secrets/filedriver/secretsdata.json, the agent user's rootless graph root
# being ~/.local/share/containers/storage), and which holds their images and
# containers too; and the nucleus and login of every environment that has
# had a GitHub identity of its own: those in the settings, and those the box
# has recorded (tasks/check-github-environments.yml), which stay on the box
# when the environment is removed or renamed. podman and docker themselves
# run outside the sandbox (excludedCommands), as the agent user, which is
# why such an environment never shares a box with one on the host
# (tasks/check-environments.yml); this holds for a box that gets one later.
claude_sandbox_github_envs: "{{ environments | selectattr('name', 'in', nucarium_container_envs) | selectattr('github', 'defined') | list }}"

# Nor the box's own long-lived credentials, which no command an agent runs
# has a use for, and which the hosts a session may reach give somewhere to
# send: every Claude login's sign-in (.credentials.json in each
# environment's config_dir, and in ~/.claude, which a box keeps when its
# first login is no longer in the settings), which Claude Code reads itself,
# outside the sandbox; and nucleated's folder, with the Nucarium Watch
# machine token and the notifier's token, which nucleated, its hooks and
# nucleate's MCP server read outside it too. `nucleated status` and
# `nucleate whoami` therefore answer only outside a session's commands.
#
# Two are not here, because the commands agents run use them. Git signs each
# commit inside the sandbox with ~/.ssh/id_ed25519_signing, and npm and pnpm
# read the packages token from ~/.npmrc (the session hook also gives it to
# every session as NODE_AUTH_TOKEN): hidden, commits and installs would fail.
claude_sandbox_credentials: >-
  {{ ((environments | map(attribute='config_dir', default=agent_home ~ '/.claude') | list) + [agent_home ~ '/.claude'])
  | unique | map('regex_replace', '$', '/.credentials.json') | list + ['~/.config/nucleated'] }}

# Nor the secret variables of the environments on the host (secret_variables)
# as files: each one's secret-variables.sh in its folder (a glob, as above),
# and the copies the session hook leaves in its login's session-env folder,
# which Claude Code reads itself, outside the sandbox, and runs ahead of
# each command. This keeps the files from a command, not the variables: every
# command of a session of that environment has them, which is what a
# variable is, and can print or send them. And only from sandboxed commands:
# what runs outside the sandbox as the agent user (Claude Code, its hooks and
# MCP servers, podman and docker) can read them in any environment on the
# host, so one host environment's secret variables are not kept from
# another's sessions.
claude_sandbox_host_secrets: >-
  {{ ['/etc/nucarium/environments/*/' ~ nucarium_host_secrets_file]
  + (environments | selectattr('name', 'in', nucarium_host_secret_envs) | map(attribute='config_dir', default=agent_home ~ '/.claude')
     | map('regex_replace', '$', '/session-env') | list) }}
claude_sandbox_deny_read: >-
  {{ (['/etc/nucarium/environments/*/box', nucarium_setups_dir, '~/.local/share/containers']
  + claude_sandbox_host_secrets
  + claude_sandbox_credentials
  + (nucarium_github_envs_recorded | default([]) | map(attribute='nucleus') | list)
  + (nucarium_github_envs_recorded | default([]) | map(attribute='config_dir') | list)
  + (claude_sandbox_github_envs | map(attribute='name') | map('regex_replace', '^', agent_home ~ '/workspace-') | list)
  + (claude_sandbox_github_envs | map(attribute='config_dir') | list)) | unique }}

