---
# nucleated's hook entry point, registered as `nucleated hooks print --env
# <name>` prints it. It writes an allowlist of fields to a local spool, prints
# nothing and exits 0 within two seconds whatever happens, so it can never
# hold a session up. SessionEnd alone is not async, so the event is written
# before the session's process goes away.
claude_nucleated_hook: $HOME/.local/bin/nucleated hook

# The notifications that change what a session is waiting for.
claude_nucleated_notifications:
  - permission_prompt
  - idle_prompt
  - agent_needs_input
  - elicitation_dialog
  - elicitation_url_dialog
  - elicitation_complete
  - elicitation_response

# A session's worktree keeps its git data in the bare repository, outside the
# session folder, so the sandbox lets agents write to .repos/. Each bare
# repository's hooks and config stay read-only: nucleated runs git there
# outside the sandbox, and a hook or a setting such as core.fsmonitor,
# core.sshCommand or core.hooksPath would let an agent's command run
# unconfined.
claude_sandbox_deny_write: >-
  {{ repos | map('basename') | product(['hooks', 'config']) | map('join', '.git/')
  | map('regex_replace', '^', nucleus_root ~ '/.repos/') | list }}

# Where sandboxed commands may write besides the session folder: everything a
# cloud session's commands may write that the agent user owns. The agent's
# home, the temp folders and pnpm's lock folders in the agent user's runtime
# folder (made at login by the cloud_parity role).
claude_pnpm_lock_dirs:
  - /run/user/{{ agent_uid }}/pnpm-dir-locks-{{ agent_uid }}
  - /run/user/{{ agent_uid }}/pnpm-modules-swaps-{{ agent_uid }}
  - /run/user/{{ agent_uid }}/pnpm-store-operation-locks-{{ agent_uid }}
claude_sandbox_allow_write: "{{ ['~', '/tmp', '/var/tmp'] + claude_pnpm_lock_dirs }}"

# What stays read-only inside the home: the keys and tokens, Claude Code's own
# configuration, and everything that runs outside the sandbox or at login.
# A change to any of these would reach a program that is not sandboxed: the
# agent server, nucleated, the session hooks, the next login, or git run by
# nucleated (the global config can name programs for git to run).
claude_sandbox_protected:
  - ~/.ssh
  - ~/.claude
  - ~/.npmrc
  - ~/.gitconfig
  - ~/.config/git
  - ~/.terraformrc
  - ~/.terraform.d
  - ~/.bashrc
  - ~/.bash_profile
  - ~/.bash_login
  - ~/.bash_logout
  - ~/.profile
  - ~/.local/bin
  - ~/.local/share/claude
  - ~/.local/share/systemd
  - ~/.config/systemd
  - ~/.config/environment.d
  - ~/.config/user-tmpfiles.d
  - ~/.config/agent-servers
  - ~/.config/nucleate
  - ~/.config/nucleated
  - ~/.config/containers

# A second login's configuration folder is protected like ~/.claude.
claude_sandbox_protected_logins: >-
  {{ environments | map(attribute='config_dir', default='') | select | list }}

