---
# Checks, before anything on the box changes, that every secret variable of
# every container environment (secret_variables) has a value:
# environment_secrets.<environment>.<NAME>, from the file given to the
# playbook (-e @environment-secrets.yml), or secrets.environments in a whole
# secrets given that way (nucarium_environment_secrets, vars/runtime.yml).
# Names what is missing, never a value. Imported by site.yml once the
# secrets are read, and by tests/render.yml, whose settings give stand-ins.
- name: Stop if a secret variable has no value
  ansible.builtin.fail:
    msg: >-
      {% for s in env_secrets_missing %}environment {{ s.env }}: secret_variables lists {{ s.name }},
      and environment_secrets.{{ s.env }}.{{ s.name }} has no value: add it to your file of environment
      secrets as quoted text, or take {{ s.name }} out of secret_variables; {% endfor %}nothing on the box has
      been changed.
  when: env_secrets_missing | length > 0
  vars:
    # A value is text, and not empty: Podman stores no empty secret, and YAML
    # turns an unquoted 0755 into a number.
    env_secrets_missing: >-
      {% set ns = namespace(out=[]) %}{% for s in nucarium_env_secrets %}{% set given = nucarium_environment_secrets[s.env] if nucarium_environment_secrets[s.env] is defined and nucarium_environment_secrets[s.env] is mapping else {} %}{% if given[s.name] is not defined or given[s.name] is not string or given[s.name] | length == 0 %}{% set ns.out = ns.out + [s] %}{% endif %}{% endfor %}{{ ns.out }}
