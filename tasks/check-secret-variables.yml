---
# Checks, before anything on the box changes, that every secret variable of
# every container environment (secret_variables) has a value:
# secrets.environments.<environment>.<NAME>, from the file of secrets given
# to the playbook (-e @secrets.yml). Names what is missing, never a value.
# Imported by site.yml once the secrets are read, and by tests/render.yml,
# whose settings give stand-ins.
- name: Stop if a secret variable has no value
  ansible.builtin.fail:
    msg: >-
      {% for s in env_secrets_missing %}environment {{ s.env }}: secret_variables lists {{ s.name }},
      and secrets.environments.{{ s.env }}.{{ s.name }} has no value: add it to your secrets as quoted
      text, or take {{ s.name }} out of secret_variables; {% endfor %}nothing on the box has been changed.
  when: env_secrets_missing | length > 0
  vars:
    env_secrets_values: "{{ (secrets | default({})).environments | default({}, true) }}"
    # A value is text, and not empty: Podman stores no empty secret, and YAML
    # turns an unquoted 0755 into a number.
    env_secrets_missing: >-
      {% set ns = namespace(out=[]) %}{% for s in nucarium_env_secrets %}{% set given = env_secrets_values[s.env] if env_secrets_values is mapping and env_secrets_values[s.env] is defined and env_secrets_values[s.env] is mapping else {} %}{% if given[s.name] is not defined or given[s.name] is not string or given[s.name] | length == 0 %}{% set ns.out = ns.out + [s] %}{% endif %}{% endfor %}{{ ns.out }}
