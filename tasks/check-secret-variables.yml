---
# Checks, before anything on the box changes, that every secret variable of
# every environment (secret_variables), in a container or on the host, has a
# value: environment_secrets.<environment>.<NAME>, from the file given to the
# playbook (-e @environment-secrets.yml), or secrets.environments in a whole
# secrets given that way (nucarium_environment_secrets, vars/runtime.yml);
# with logins and setups, setup_secrets.<setup>.<NAME> or secrets.setups.
# Names what is missing, never a value. Imported by site.yml once the
# secrets are read, and by tests/render.yml, whose settings give stand-ins.
- name: Stop if a secret variable has no value
  ansible.builtin.fail:
    msg: >-
      {{ env_secrets_missing_said | unique | join('; ') }}; nothing on the box has been changed.
  when: env_secrets_missing | length > 0
  vars:
    # What to say about each, once: a setup's missing value is missing for
    # every login that joins it.
    env_secrets_missing_said: >-
      {% set ns = namespace(out=[]) %}{% for s in env_secrets_missing %}{% set e = environments | selectattr('name', 'equalto', s.env) | first %}{% set ns.out = ns.out + [('setup ' ~ e.setup ~ ': secret_variables lists ' ~ s.name ~ ', and setup_secrets.' ~ e.setup ~ '.' ~ s.name ~ ' has no value: add it to your file of environment secrets as quoted text, or take ' ~ s.name ~ ' out of the setup' ~ "'" ~ 's secret_variables') if e.setup is defined else ('environment ' ~ s.env ~ ': secret_variables lists ' ~ s.name ~ ', and environment_secrets.' ~ s.env ~ '.' ~ s.name ~ ' has no value: add it to your file of environment secrets as quoted text, or take ' ~ s.name ~ ' out of secret_variables')] %}{% endfor %}{{ ns.out }}
    # A value is text, and not empty: Podman stores no empty secret, and YAML
    # turns an unquoted 0755 into a number. The same on the host.
    env_secrets_missing: >-
      {% set ns = namespace(out=[]) %}{% for s in nucarium_env_secrets + nucarium_host_env_secrets %}{% set given = nucarium_environment_secrets[s.env] if nucarium_environment_secrets[s.env] is defined and nucarium_environment_secrets[s.env] is mapping else {} %}{% if given[s.name] is not defined or given[s.name] is not string or given[s.name] | length == 0 %}{% set ns.out = ns.out + [s] %}{% endif %}{% endfor %}{{ ns.out }}

# No variable holds a NUL character: a process's environment ends each one
# at the first. Any other character is kept as written, a newline too: on
# the host the value is shell-quoted, in a container it is a Podman secret.
- name: Stop if a secret variable's value could not be a variable's
  ansible.builtin.fail:
    msg: >-
      {{ env_secrets_nul | map(attribute='env') | map('extract', nucarium_env_labels) | zip(env_secrets_nul | map(attribute='name')) | map('join', ': ') | join('; ') }}:
      the value has a NUL character in it, which no variable can hold; nothing on the box has been changed.
  when: env_secrets_nul | length > 0
  vars:
    env_secrets_nul: >-
      {% set ns = namespace(out=[]) %}{% for s in nucarium_env_secrets + nucarium_host_env_secrets %}{% if '\0' in nucarium_environment_secrets[s.env][s.name] %}{% set ns.out = ns.out + [s] %}{% endif %}{% endfor %}{{ ns.out }}
