[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = /usr/bin/python3
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
# Tasks travel over the SSH connection instead of being copied to the box
# first. Needed so tasks can run as the unprivileged agent user, and it keeps
# the Nucarium Watch token out of any file on the way to nucleate login.
pipelining = True
