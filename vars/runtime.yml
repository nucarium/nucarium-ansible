---
# What several roles share about where environments run, host or container.

# The names of the environments that run in a container (runtime: container).
nucarium_container_envs: "{{ environments | selectattr('runtime', 'defined') | selectattr('runtime', 'equalto', 'container') | map(attribute='name') | list }}"

# The clone address of one entry of repos (the loop variable item): an entry
# with a slash names its owner (other-org/tools), a bare name belongs to
# github_org. roles/env_setup/templates/repos.j2 writes the same address.
nucarium_repo_url: "https://github.com/{{ item if '/' in item else github_org ~ '/' ~ item }}.git"

# The first release of nucleate and nucleated in which both check a bare
# repository's git config (an allowlist of keys) and worktree pointers before
# they run git there, and run git with core.hooksPath=/dev/null. A container
# environment can write that config, so the playbook refuses one with an
# older nucleate_version.
nucleate_minimum_for_containers: "0.7.0"

# The files at the root of a container environment's own nucleus
# ({{ agent_home }}/workspace-<name>, which the workspace role makes) that
# its container gets read-only and does not start without (agent-env-start
# checks the same list), so that no session plants there what later sessions
# and servers read as instructions or run as hooks: .claude/ (with the
# worktree hooks, .claude/settings.json), .mcp.json, AGENTS.md, CLAUDE.md
# and the seed files. A file the playbook writes there it writes in place,
# so that a running container's read-only mount of it stays on the same file.
nucarium_nucleus_protected:
  - .claude
  - .seeds
  - .mcp.json
  - AGENTS.md
  - CLAUDE.md

# One file per Claude login a container environment has used, root's, named
# after its config_dir. A container can write its login's folder (its MCP
# servers, its hooks), so such a login is never used on the host again: the
# playbook refuses runtime: host for it (tasks/check-container-logins.yml).
# Kept when the environment is removed or renamed.
nucarium_container_logins_dir: /etc/nucarium/container-logins

# PATH in a container environment: the base image's (ENV PATH in
# roles/env_runtime/files/base/Containerfile, which tests/render.yml checks
# this against), then the box's own tools, mounted read-only from the host
# (claude, nucleate, nucleated), last, so that the image's and the setup
# script's come first. Set by the container's unit, so that podman exec and
# the agent server and its sessions all have it.
nucarium_image_path: >-
  /root/.local/bin:/opt/node{{ node_version }}/bin:/root/.cargo/bin:/usr/local/go/bin:/root/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:{{ agent_home }}/.local/bin

# The box's own helpers, root's: the agent user can read and run them but
# not change them, and every container environment has the folder mounted
# read-only at the same path. session-env.sh (the claude role), and
# agent-server-runtime, agent-env-start and agent-env-hold (the
# agent_servers role).
nucarium_lib_dir: /usr/local/lib/nucarium

# What a container environment uses of the box's own Git and npm settings,
# root's, mounted read-only at the same path (the env_runtime role): the Git
# identity, commit signing and GitHub credential helper (gitconfig, which the
# base image's /root/.gitconfig includes), the signing key pair, and the npm
# token file NPM_CONFIG_GLOBALCONFIG names.
nucarium_box_dir: /etc/nucarium/box

# The Podman secret, the agent user's, that holds the GitHub Packages token
# (secrets.npm_token) and gives it to every container environment's
# processes as NODE_AUTH_TOKEN: pnpm reads registry credentials only from a
# user's ~/.npmrc, where agent-env-hold writes the line that names the
# variable. Only on a box with an npm token.
nucarium_npm_secret: nucarium-npm-token

# The folder each container environment's agent server runs in, one per
# environment and named after it, root's: Claude Code names a Remote Control
# server after its folder, so each shows in the Claude app under its
# environment's name rather than all as "workspace". It holds only the
# worktree hooks (.claude/settings.json), the nucleus's own being written for
# the host.
nucarium_servers_dir: /etc/nucarium/servers

# The Git credential helper for github.com, on the box and in every
# container environment: the GitHub App's short-lived token, which the broker
# keeps fresh in /run/agent-tokens.
nucarium_git_credential_helper: >-
  !f() { [ "$1" = get ] && printf "username=x-access-token\npassword=%s\n"
  "$(cat /run/agent-tokens/github)"; }; f

# The same, in a container environment with a GitHub identity of its own
# (github on the environment): its own token, the secret variable
# GITHUB_TOKEN its container has (secret_variables), and never the App's.
nucarium_env_git_credential_helper: >-
  !f() { [ "$1" = get ] && printf "username=x-access-token\npassword=%s\n"
  "$GITHUB_TOKEN"; }; f

# The folder of a container environment with a GitHub identity of its own,
# root's and laid out like nucarium_box_dir: its own Git settings and signing
# key pair, which its container has mounted at nucarium_box_dir in place of
# the box's (the env_runtime role). Inside the environment's own folder, by
# name; the loop variable is env.
nucarium_env_box_dir: /etc/nucarium/environments/{{ env.name }}/box

# Each secret variable of each container environment (secret_variables), as
# the agent user's Podman secret of that name, which its container gets as
# the variable (Secret= in agent-env.container.j2): nucarium-env-<env>-<the
# name in lower case, with - for _>. Every Podman secret whose name starts
# with nucarium_env_secret_prefix and is not on this list is removed.
nucarium_env_secret_prefix: nucarium-env-
nucarium_env_secrets: >-
  {% set ns = namespace(out=[]) %}{% for e in environments if e.name in nucarium_container_envs %}{% for name in e.secret_variables | default([], true) %}{% set ns.out = ns.out + [{'env': e.name, 'name': name, 'secret': nucarium_env_secret_prefix ~ e.name ~ '-' ~ (name | lower | replace('_', '-'))}] %}{% endfor %}{% endfor %}{{ ns.out }}

# nucleated's state folder, which holds the spool its hooks write session
# events to: the daemon's own default, written out. A container environment
# writes the spool, mounted at the same path, and nothing else of it.
nucarium_nucleated_state_dir: "{{ agent_home }}/.local/state/nucleated"

# The configuration nucleated's hook reads inside a container environment
# (NUCLEATED_CONFIG): the environments and the state folder, and no token.
# A folder, mounted read-only, so that a rewritten file is seen; the day2
# role writes it.
nucarium_nucleated_hook_dir: "{{ agent_home }}/.config/nucleated-hook"
