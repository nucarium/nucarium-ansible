---
name: Pin nucleate

# Moves the recipe's pin when nucarium-cli publishes a release of nucleate.
# That repository's Binaries workflow sends the version and the archives'
# checksums once the archives are attached to the release. This workflow then:
#
#   1. downloads the two Linux archives the playbook installs, x86_64 and
#      aarch64, and refuses either unless it hashes to the checksum it was
#      sent;
#   2. rewrites nucleate_version, nucleate_sha256 and nucleate_sha256_aarch64
#      in group_vars/all.yml, those three lines and nothing else;
#   3. commits that to main as "feat: nucleate X.Y.Z".
#
# The commit is a feat, so the push makes a minor release of the recipe, and
# publishing that release starts package.yml, which packs the recipe and
# tells the installer.
#
# Needs two secrets, GH_APP_ID and GH_PRIVATE_KEY, the Robot App's, and the
# App installed on nucarium-cli as well as here. The commit is made as the App
# and through the API: a push made with the workflow's own token would not
# start Release, and a commit made through the API is signed by GitHub.

on:
  repository_dispatch:
    types: [nucleate-released]

permissions:
  contents: read

concurrency:
  group: pin-nucleate
  cancel-in-progress: false

# Everything from the event goes through the environment, and the first step
# refuses a version or a checksum that is not exactly the right shape.
env:
  VERSION: ${{ github.event.client_payload.version }}
  # A box is x86_64 or aarch64 Linux (vars/architecture.yml), so those two
  # archives' checksums are the ones the recipe pins. The two macOS ones are
  # sent too and are not used here.
  TARGET: x86_64-unknown-linux-musl
  SHA256: ${{ github.event.client_payload.sha256.x86_64-unknown-linux-musl }}
  TARGET_AARCH64: aarch64-unknown-linux-musl
  SHA256_AARCH64: ${{ github.event.client_payload.sha256.aarch64-unknown-linux-musl }}
  SETTINGS: group_vars/all.yml

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a version or a checksum of the wrong shape
        run: |
          if ! [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The version sent is not a version like 1.2.3."
            exit 1
          fi
          if ! [[ $SHA256 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The checksum sent for $TARGET is not a SHA-256."
            exit 1
          fi
          if ! [[ $SHA256_AARCH64 =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The checksum sent for $TARGET_AARCH64 is not a SHA-256."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: See what the recipe pins now
        id: now
        run: |
          current=$(sed -n 's/^nucleate_version: "\(.*\)"$/\1/p' "$SETTINGS")
          pinned=$(sed -n 's/^nucleate_sha256: "\(.*\)"$/\1/p' "$SETTINGS")
          pinned_aarch64=$(sed -n 's/^nucleate_sha256_aarch64: "\(.*\)"$/\1/p' "$SETTINGS")
          if [ "$current" = "$VERSION" ]; then
            if [ "$pinned" = "$SHA256" ] && [ "$pinned_aarch64" = "$SHA256_AARCH64" ]; then
              echo "The recipe already pins nucleate $VERSION."
              echo "move=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # A release asset is never replaced. If one was, every box built
            # from this recipe refuses the download, and that is for a person
            # to see.
            echo "::error::The recipe pins nucleate $VERSION with different checksums. Look at that release before changing the pin by hand."
            exit 1
          fi
          newest=$(printf '%s\n' "$current" "$VERSION" | sort -V | tail -n 1)
          if [ "$newest" != "$VERSION" ]; then
            echo "::notice::The recipe pins nucleate $current, which is newer than $VERSION. Nothing to do."
            echo "move=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "move=true" >> "$GITHUB_OUTPUT"

      - name: Generate a read-only Robot App token for nucleate's repository
        if: steps.now.outputs.move == 'true'
        uses: actions/create-github-app-token@v3
        id: cli-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}
          owner: nucarium
          repositories: nucarium-cli
          permission-contents: read

      # The same files, from the same addresses, that the playbook downloads.
      - name: Download the archives and check they are the ones described
        if: steps.now.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ steps.cli-token.outputs.token }}
        run: |
          check() {
            name="nucleate-v$VERSION-$1.tar.gz"
            gh release download "v$VERSION" --repo nucarium/nucarium-cli --pattern "$name" --dir "$RUNNER_TEMP"
            echo "$2  $RUNNER_TEMP/$name" | sha256sum --check --quiet
            # Both programs, at the archive's top level, as the playbook expects.
            tar -tzf "$RUNNER_TEMP/$name" > "$RUNNER_TEMP/listing.txt"
            for needed in nucleate nucleated; do
              grep -qx "$needed" "$RUNNER_TEMP/listing.txt" || { echo "::error::$name has no $needed."; exit 1; }
            done
          }
          check "$TARGET" "$SHA256"
          check "$TARGET_AARCH64" "$SHA256_AARCH64"

      - name: Move the pin
        if: steps.now.outputs.move == 'true'
        run: |
          perl -pi -e '
            s/^nucleate_version: "[^"]*"$/nucleate_version: "$ENV{VERSION}"/;
            s/^nucleate_sha256: "[^"]*"$/nucleate_sha256: "$ENV{SHA256}"/;
            s/^nucleate_sha256_aarch64: "[^"]*"$/nucleate_sha256_aarch64: "$ENV{SHA256_AARCH64}"/;
          ' "$SETTINGS"
          grep -qx "nucleate_version: \"$VERSION\"" "$SETTINGS"
          grep -qx "nucleate_sha256: \"$SHA256\"" "$SETTINGS"
          grep -qx "nucleate_sha256_aarch64: \"$SHA256_AARCH64\"" "$SETTINGS"
          # Those three lines and nothing else, in that one file and no other.
          test "$(git status --porcelain --untracked-files=all)" = " M $SETTINGS"
          test "$(git diff --numstat -- "$SETTINGS" | cut -f1,2)" = "$(printf '3\t3')"

      - name: Generate Robot App token for this repository
        if: steps.now.outputs.move == 'true'
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_PRIVATE_KEY }}

      # The file is replaced only if it is still the one that was checked out.
      # If main has changed it since, the call is refused and nothing changes:
      # run the workflow again.
      - name: Commit the pin to main
        if: steps.now.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$SETTINGS" \
            -f "message=feat: nucleate $VERSION" \
            -f "branch=$BRANCH" \
            -f "sha=$(git rev-parse "HEAD:$SETTINGS")" \
            -f "content=$(base64 -w0 "$SETTINGS")" \
            --jq '.commit.sha'
