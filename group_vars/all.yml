---
# Settings for the Nucarium box recipe. Everything that differs between boxes
# lives in this file and in inventory.ini.
#
# Nothing secret is stored here. secret_refs, at the end, holds 1Password
# references; the values are read on your workstation with `op read` when a
# playbook runs.

# ---------------------------------------------------------------------------
# People
# ---------------------------------------------------------------------------

# Your own user on the box: the account you log in and use sudo with. The
# unattended install creates it. Lower-case letters and digits.
operator_user: ops

# The user the agents run as. It has no sudo and none of your credentials.
# There is rarely a reason to change it.
agent_user: agent

# The box's time zone, as a tz database name (Europe/Berlin, America/Chicago).
# Timers such as the nightly backup run in this zone.
timezone: Etc/UTC

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------

# Your home or office network's address range, in CIDR form. SSH from this
# range stays allowed as a fallback beside Tailscale. Set it to "" to allow
# SSH over Tailscale only; do that once Tailscale is proven.
lan_ssh_cidr: 192.168.1.0/24

# Whether to prefer IPv4 when a host has both an IPv4 and an IPv6 address.
# Set it to true when the network advertises IPv6 but does not carry it:
# programs that try IPv6 first (Node, and so npm, pnpm and Playwright) then
# stall on every download. Check from the box with
# `curl -6 -sS -o /dev/null https://github.com`: a timeout means true.
prefer_ipv4: false

# The Tailscale tag the box joins your tailnet with. The tag must exist in
# your tailnet's access controls, where it stops the box opening connections
# to your other devices.
tailscale_tag: tag:agent-box

# ---------------------------------------------------------------------------
# GitHub
# ---------------------------------------------------------------------------

# The name and email on the agents' commits. The email must be verified on
# your GitHub account, or the commits do not show as Verified.
git_user_name: Your Name
git_user_email: you@example.com

# The GitHub organisation (or user) that owns your repositories. Also the
# scope of the packages the box may download from GitHub Packages.
github_org: your-org

# The repositories agents can add to a session. A bare name is a repository
# in github_org; write owner/name for one that lives elsewhere. Each is
# cloned bare into the nucleus, and sessions see it under its GitHub name
# (your-org/web). The agents' GitHub App must be installed on every one.
repos:
  - web
  - api

# The GitHub App the agents push and open pull requests through. Both values
# are on the app's settings pages and neither is secret: the client ID starts
# with "Iv", and the installation ID is the number at the end of the
# installation's address (…/installations/<id>). Keep the quotes.
github_app_client_id: Iv23example
github_app_installation_id: "12345678"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------

# One entry per Claude login. Each is an environment: one login running one
# agent server (Claude Code's Remote Control server) over the nucleus, shown
# as one environment in Nucarium Watch. Most boxes have one. Add an entry to
# run a second login of the same organisation on this box. Environments on
# the host are not isolated from each other: they share the agent user, the
# nucleus, its repositories and the GitHub App. A container environment
# (runtime: container) can have repositories, secrets and a GitHub identity
# of its own, below, so that it can belong to another owner: the others
# cannot see its credentials or its code. Environments of different owners
# need every environment on the box in a container: sessions on the host
# run podman outside their sandbox, as the user that owns every container's
# secrets, so the playbook refuses github and secret_variables on a box
# with an environment on the host.
#
#   name        A short label: lower-case letters, digits and hyphens. It
#               names the service (agent-server@<name>, or agent-env-<name>
#               in a container), prefixes session
#               names (<box>-<name>-…), and names the environment in Watch.
#   config_dir  The full path of the folder that holds this login's Claude
#               configuration. Left out, it is ~/.claude in the agent user's
#               home, which is right for the first login. A second login
#               needs its own, for example /home/agent/.claude-second.
#   capacity    The most sessions this environment runs at once. Left out,
#               it is 12, which suits 64 GB.
#   runtime     host or container. Left out, it is host: the agent server
#               and its sessions run on the box as the agent user, in
#               Claude Code's sandbox, as described here. container runs
#               them in a rootless Podman container of the environment's own
#               (agent-env-<name>, the agent user's), as root, on Ubuntu
#               24.04 with a cloud session's tools: its setup script is
#               built into the image, its network is enforced by a proxy of
#               its own, and nothing it installs or starts reaches the box or
#               another environment. It has a nucleus of its own,
#               ~agent/workspace-<name>, with its own clones of repos, its
#               own sessions and its own AGENTS.md, and shares only the
#               GitHub App and Claude Code with the box. It needs a config_dir of its
#               own, directly in the agent user's home and named
#               .claude-<something> (/home/agent/.claude-<name>): the
#               container can write that login, so once it has been a
#               container's the playbook refuses it on the host, and moving
#               the environment back needs a new config_dir and a new
#               sign-in. It also needs nucleate_version at
#               nucleate_minimum_for_containers (vars/runtime.yml) or later:
#               a container can write its bare repositories' config, and
#               from that release nucleate and nucleated, which run git there
#               on the host, check the config and run no hook first; the
#               recipe enforces the check. Its nucleus's .claude, .seeds,
#               .mcp.json, AGENTS.md, CLAUDE.md and each repository's hooks
#               are read-only in it. The playbook clones into its nucleus
#               only while it is new; a repository added to repos later is
#               cloned by its agent server, inside the container, at its next
#               start.
#               Changing it takes effect when the environment's agent server
#               next stops by itself (after about ten minutes with no
#               session), never mid-session; it needs
#               `--tags env_runtime,env_setup,claude,workspace,agent_servers,day2`.
#               A container's first start needs two answers by hand, as on
#               the host; the closing message of the playbook lists them.
#
# Each environment can also have what a Claude Code cloud environment has,
# set here on the box and shown, read-only, in Watch:
#
#   network        What commands in its sessions may reach: none, limited
#                  or full (any host). Left out, it is limited: the hosts a
#                  cloud session reaches by default (package registries,
#                  GitHub, cloud SDKs) plus sandbox_extra_allowed_domains.
#                  On the host it governs the commands agents run in the
#                  sandbox. Claude Code's own WebFetch tool is not one of
#                  them: even with none, it can still fetch a page once a
#                  permission prompt is approved. In a container it governs
#                  everything in it, through the environment's proxy;
#                  Claude Code's own hosts are always reachable.
#   allowed_hosts  More hosts for limited, one per line, on top of that
#                  list. A leading *. matches every subdomain.
#   variables      NAME: value lines, set in every new session of the
#                  environment. Not secret: anything in this file can be read
#                  by the agents. Quote every value ("3.10", "0755", "true"):
#                  unquoted, YAML changes them, so the playbook refuses them.
#   setup_script   A bash script, run as root in /root before the agent
#                  server starts: at every boot, and once more
#                  whenever you change it. Running it again never restarts an
#                  agent server or interrupts a session, and a script that
#                  fails still lets the server start. Up to 30 minutes; its
#                  output is in the box's journal (journalctl -u
#                  nucarium-env-setup@<name>), and Watch says when it fails.
#                  It must be safe to run more than once. The nucleus's
#                  path is in $NUCLEUS_ROOT; the agent can write there, so do
#                  anything inside it as the agent (runuser -u agent -- ...).
#                  In a container it runs once, when the image is built
#                  (when the script, the variables, the network or the base
#                  image change), as a cloud environment's does: with the
#                  environment's variables and network, and without the
#                  nucleus. What it writes, /root included, is in every
#                  session; what it starts is not running, which is what
#                  start_script is for. What it exports in a file in
#                  /etc/profile.d reaches the agent server and every
#                  session, as in a cloud session. Its output is in the
#                  agent user's journal (journalctl --user -u
#                  nucarium-env-build@<name>). It does not get the secret
#                  variables.
#
# Ansible reads {{, {% and {# in a value as a template, and a script often
# has them: ${#list[@]}, or docker ps --format '{{.Names}}'. Write !unsafe
# after the key, setup_script: !unsafe |, to have it taken as written, and
# the same before a variable's value that has them, NAME: !unsafe '{{.Names}}'.
# Without it the playbook stops and names the environment and the key.
#
# Changing any of these needs `--tags claude,env_setup`, and
# `env_runtime,env_setup` for a container environment, whose image is then
# built again; new sessions see the change (in a container, from its next
# start). For example:
#
#   - name: main
#     network: limited
#     allowed_hosts:
#       - api.example.com
#       - "*.internal.example.com"
#     variables:
#       NODE_ENV: development
#       FEATURE_FLAGS: "beta,dark-mode"
#     setup_script: !unsafe |
#       packages=(libvips-dev jq)
#       echo "Installing ${#packages[@]} packages"
#       apt-get install -y --no-install-recommends "${packages[@]}"
#
# A container environment can also have these, which a host environment
# cannot (the playbook refuses them there). Left out, it uses the box's:
#
#   repos            Its own repositories, in place of the box's repos, in
#                    the same form: a bare name is in github_org, owner/name
#                    names its owner. Its nucleus offers only these.
#   secret_variables Names of variables whose values are secret, one per
#                    line, set in its container, its agent server and every
#                    session (a Terraform token, say). The values are not
#                    in this file: each is environment_secrets.<env>.<NAME>
#                    in a file of your own you give the playbook
#                    (-e @environment-secrets.yml, an Ansible Vault file
#                    say), which leaves secret_refs as they are; a whole
#                    secrets given with -e may hold them as
#                    secrets.environments instead. The playbook stops,
#                    changing nothing, when one has no value. Each is kept
#                    as the agent user's Podman secret
#                    nucarium-env-<env>-<name>. A name may not also be in
#                    variables, and GITHUB_TOKEN and GH_TOKEN need github.
#                    Not in the image: the setup script does not get them.
#   github           Its own GitHub identity: name: and email:, for its
#                    commits. It needs GITHUB_TOKEN in secret_variables,
#                    a token of that GitHub account, which its Git uses for
#                    github.com, and nucleate and nucleated, from a file in
#                    the environment's own folder, for its repositories.
#                    With it, the environment uses nothing of the box's
#                    GitHub: not the GitHub App, not git_user_name and its
#                    signing key, not the packages token (list
#                    NODE_AUTH_TOKEN in secret_variables for one of its
#                    own). It signs its commits with a key of its own, made
#                    once on the box; the playbook copies its public half to
#                    out/<box>-<env>-signing.pub, and the closing message
#                    says how to register it on that account. The host clones
#                    none of its repositories: its agent server clones them,
#                    in the container, at its first start. The box remembers
#                    it: removed or renamed, its nucleus and login stay on
#                    the box, sessions on the host never read them, and the
#                    playbook refuses an environment without github that has
#                    its name or config_dir.
#   start_script     A bash script, run as root in /root in its container
#                    each time the container starts, before the agent server:
#                    for the services the setup script installed (a database
#                    server, say), which are not running otherwise. Up to five
#                    minutes; its output is in the server's tmux session,
#                    and one that fails still lets the server start. What it
#                    exports in a file in /etc/profile.d reaches the server
#                    and every session.
#
# Changing these needs
# `--tags claude,env_runtime,env_setup,workspace,agent_servers`; the
# container takes them up at its next start. Sandboxed commands on the host
# cannot read a container environment's own Git settings and key, the
# Podman storage that holds the secret variables, or, once it has had
# github, its nucleus and login. For example:
#
#   - name: acme
#     config_dir: /home/agent/.claude-acme
#     runtime: container
#     repos:
#       - acme/web
#       - other-org/tools
#     secret_variables:
#       - GITHUB_TOKEN
#       - TF_TOKEN
#     github:
#       name: Acme Agent
#       email: agent@example.com
#     start_script: |
#       service postgresql start
#
# with, in the file of environment secrets (-e @environment-secrets.yml):
#
#   environment_secrets:
#     acme:
#       GITHUB_TOKEN: "..."
#       TF_TOKEN: "..."
environments:
  - name: main
    capacity: 12

# A memory cap on all agent servers and their sessions together, so a runaway
# build cannot take the box, SSH and Tailscale down with it. Above the first
# figure sessions are slowed; at the second the largest is stopped. These
# suit 64 GB; raise both if the box has more.
agents_memory_high: 48G
agents_memory_max: 56G

# ---------------------------------------------------------------------------
# Nucarium Watch
# ---------------------------------------------------------------------------

# Where the box reports: Nucarium Watch (app.nucarium.com), which tells you
# when an agent needs you or the box goes dark, or nowhere. Watch receives
# metadata only: which agent is doing what, where and since when, never what
# it was told or what it wrote.
#
#   hosted  Report to Watch. Nothing is sent until the box is signed in. To
#           sign it in, either run `nucleate login` on it afterwards and
#           approve the code it shows from your phone, or mint a machine
#           token in the Watch console, save it in 1Password and put its
#           reference in secret_refs.watch_machine_token below.
#   none    Report nowhere, even if the box is signed in. `nucleated status`
#           on the box shows the same view.
watch_target: hosted

# If Watch itself cannot be reached, nothing tells you that an agent is
# waiting. Give the box an address of your own here and it tells you itself:
# once when Watch has been unreachable for ten minutes, once for each session
# that starts waiting for you while that lasts, and once when Watch answers
# again. Each post carries the box's and the environment's name and a time,
# and goes to this address only, never to Nucarium.
#
# The address takes the same request as an alert destination in Watch, so a
# push topic such as https://ntfy.sh/<your-topic> works as it is. It starts
# with https://, or http:// for a service on the box itself, and holds no
# username or password: if it needs a token, save the token in 1Password and
# put its reference in secret_refs.box_notify_token below.
#
# It is used only while watch_target is hosted and the box is signed in, and
# it covers Watch being unreachable, not a box with no network at all.
# Empty: the box posts nowhere.
box_notify_url: ""

# ---------------------------------------------------------------------------
# UPS
# ---------------------------------------------------------------------------

# Whether a UPS is connected to the box by USB. Set it to false on a box with
# none (a virtual machine, say); the rest of this section is then ignored.
nut_enabled: true

# A short name for the UPS, used in commands such as `upsc ups`.
ups_name: ups

# A description of the UPS, for your own reference.
ups_description: CyberPower VP700ELCD

# Shut the box down when the battery falls to this charge (percent) or this
# much runtime (seconds), whichever comes first.
ups_charge_low: 40
ups_runtime_low: 600

# After the shutdown starts, the UPS switches its outlets off after
# ups_offdelay seconds and back on after ups_ondelay seconds, which is what
# restarts the box. Many UPS models count these in whole minutes.
ups_offdelay: 60
ups_ondelay: 120

# ---------------------------------------------------------------------------
# Tools on the box
# ---------------------------------------------------------------------------

# The release of nucleate (the workspace CLI) and nucleated (the box daemon)
# to install, from github.com/nucarium/nucarium-cli, and the SHA-256 of its Linux
# archive as published beside it on the releases page. The download is
# refused unless it matches. Change both together.
nucleate_version: "0.8.0"
nucleate_sha256: "8af58aa27d76b2219760052898010aef4d3f16205513b9e3f48173d488d7e201"

# For testing a build of your own: the path, on your workstation, of a
# .tar.gz holding the two binaries, nucleate and nucleated, at its top level.
# When set, it is installed instead of the release above and no checksum is
# checked.
nucleate_local_archive: ""

# The Go and Node versions to install for the agents. Go downloads a newer
# toolchain by itself when a repository asks for one.
go_version: "1.27.1"
node_version: "24"

# The rest of what agents find on the box matches a Claude Code cloud session,
# so nothing about the box surprises them (the cloud_parity role). Three
# versions are pinned here:
#
#   playwright_version          The Playwright your repositories lock.
#                               Its Chromium is installed in /opt/pw-browsers,
#                               with the system libraries it needs. Agents
#                               cannot download browsers themselves: like a
#                               cloud session, the sandbox does not allow
#                               Playwright's download hosts. A repository that
#                               moves to another Playwright needs this changed
#                               and `--tags cloud_parity` run.
#   chrome_for_testing_version  Chrome for Testing at /usr/bin/google-chrome.
#   gradle_version              Gradle, checked against its published sum.
#
# The base image of container environments (runtime: container) is built
# from these same pins and go_version and node_version above, and has nvm
# at the release nvm_version names, in /opt/nvm as a cloud session has it
# (nothing sources it: the image's Node stays node_version's). After changing
# one, `--tags env_runtime` builds it again.
playwright_version: "1.63.0"
chrome_for_testing_version: "153.0.8010.12"
gradle_version: "8.14.3"
nvm_version: "0.40.8"

# Hosts sandboxed commands may reach beyond what a cloud session allows by
# default (Claude Code's package-registry, GitHub and cloud-SDK list, kept in
# roles/claude/vars/main.yml). One per line; a leading *. matches every
# subdomain. Changing it needs `--tags claude`, and new sessions see it.
sandbox_extra_allowed_domains: []

# HCP Terraform token for local module downloads:
#   none   No Terraform on this box.
#   file   The token is read from secret_refs.hcp_token when the playbook
#          runs and kept on the box by the token broker.
#   vault  The box reads secret_refs.hcp_token from 1Password every 20
#          minutes, using the service-account token in
#          secret_refs.vault_read_token. Use this when several boxes share
#          one token.
hcp_mode: none

# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------

# 1Password references (op://vault/item/field), read on your workstation.
# The vault, item and field names are examples: point them at your own
# items. Leave a value empty to skip that feature.
#
#   become_password          Your sudo password on the box.
#   luks_passphrase          The disk-encryption passphrase.
#   grub_password            The boot-menu password. Empty: none is set.
#   tailscale_auth_key       A pre-approved, tagged, non-ephemeral auth key.
#   ubuntu_pro_token         Ubuntu Pro, for kernel fixes without a reboot.
#   github_app_pem           The GitHub App's private key (.pem file).
#   npm_token                A classic token with only read:packages.
#   hcp_token                See hcp_mode.
#   vault_read_token         See hcp_mode.
#   watch_machine_token      A Nucarium Watch machine token, minted in the
#                            Watch console. Empty: run `nucleate login` on
#                            the box instead.
#   box_notify_token         The token for box_notify_url, sent as a bearer
#                            token. Empty: none is sent.
#   restic_repository        The nightly backup's bucket, as a restic
#                            repository (s3:https://…). Empty: no backup.
#   restic_password          The backup's encryption password.
#   restic_access_key_id     The bucket's access key.
#   restic_secret_access_key The bucket's secret key.
secret_refs:
  become_password: op://Infra/agentbox/sudo-password
  luks_passphrase: op://Infra/agentbox/disk-passphrase
  grub_password: op://Infra/agentbox/boot-menu-password
  tailscale_auth_key: op://Infra/agentbox/tailscale-auth-key
  ubuntu_pro_token: ""
  github_app_pem: op://Infra/agentbox/github-app-private-key.pem
  npm_token: op://Infra/agentbox/npm-read-packages-token
  hcp_token: ""
  vault_read_token: ""
  watch_machine_token: ""
  box_notify_token: ""
  restic_repository: ""
  restic_password: ""
  restic_access_key_id: ""
  restic_secret_access_key: ""
