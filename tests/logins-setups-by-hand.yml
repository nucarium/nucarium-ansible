---
# The environments tests/logins-setups.yml makes from its logins and setups,
# written by hand. scripts/check renders both and requires the same files.
nucleate_version: "0.7.0"
secrets:
  npm_token: render-only
environment_secrets:
  acme-alice: &acme_secrets
    GITHUB_TOKEN: render-only-github
    TF_TOKEN: render-only-terraform
  acme-bob: *acme_secrets
  tools-alice:
    API_KEY: render-only-key
environments:
  - name: acme-alice
    config_dir: /home/agent/.claude-acme-alice
    capacity: 4
    runtime: container
    repos: &acme_repos
      - acme/web
      - acme/api
    variables: &acme_variables
      NODE_ENV: development
    secret_variables: &acme_secret_variables
      - GITHUB_TOKEN
      - TF_TOKEN
    github: &acme_github
      name: Acme Agent
      email: agent@example.com
    start_script: &acme_start !unsafe |
      service postgresql start
      services=(postgresql)
      echo "${#services[@]} started"
  - name: tools-alice
    config_dir: /home/agent/.claude-tools-alice
    capacity: 4
    runtime: container
    repos:
      - other-org/tools
    secret_variables:
      - API_KEY
  - name: acme-bob
    config_dir: /home/agent/.claude-acme-bob
    runtime: container
    repos: *acme_repos
    variables: *acme_variables
    secret_variables: *acme_secret_variables
    github: *acme_github
    start_script: *acme_start
