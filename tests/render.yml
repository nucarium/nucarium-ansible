---
# Renders every template against the example settings, on your workstation,
# into out/render/. Nothing connects to a box.
#
#   ansible-playbook tests/render.yml
#   ansible-playbook tests/render.yml -e @tests/two-logins.yml
- name: Render the templates locally
  hosts: boxes
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../roles/workspace/vars/main.yml
    - ../roles/claude/vars/main.yml
    - ../roles/day2/vars/main.yml
  vars:
    render_dir: "{{ playbook_dir }}/../out/render"
    agent_home: /home/{{ agent_user }}
    agent_uid: "1001"
    nucleus_root: "{{ agent_home }}/workspace"
    env_config_dir: "{{ env.config_dir | default(agent_home ~ '/.claude') }}"
    env_claude: "{{ {} if env_config_dir == agent_home ~ '/.claude' else {'CLAUDE_CONFIG_DIR': env_config_dir} }}"
    watch_console_url: https://app.nucarium.com
    render_per_server:
      - src: ../roles/agent_servers/templates/agent-server.env.j2
        dest: env
      - src: ../roles/claude/templates/settings.json.j2
        dest: settings.json
    # Stand-ins for values the real run reads from the box.
    nut_password:
      content: "{{ 'example-monitor-password' | b64encode }}"
  tasks:
    - name: Start from an empty folder
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: "{{ item }}"
        mode: "0700"
      loop:
        - absent
        - directory

    - name: Render the templates that are the same for every agent server
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - src: ../roles/day2/templates/nucleated-config.toml.j2
          dest: nucleated-config.toml
        - src: ../roles/workspace/templates/nucleate-config.toml.j2
          dest: nucleate-config.toml
        - src: ../roles/agent_servers/templates/agents.slice.j2
          dest: agents.slice
        - src: ../roles/day2/templates/agent-backup.service.j2
          dest: agent-backup.service
        - src: ../roles/broker/templates/agent-github-token.j2
          dest: agent-github-token
        - src: ../roles/broker/templates/agent-hcp-token.j2
          dest: agent-hcp-token
        - src: ../roles/nut/templates/ups.conf.j2
          dest: ups.conf
        - src: ../roles/nut/templates/upsd.users.j2
          dest: upsd.users
        - src: ../roles/nut/templates/upsmon.conf.j2
          dest: upsmon.conf
      loop_control:
        label: "{{ item.dest }}"

    # The daemon's configuration is the one file here another program parses,
    # so it is read back the way the daemon reads it: as TOML. It must say
    # what the settings ask for and nothing they do not.
    - name: Read the daemon's configuration back as TOML
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - import json, sys, tomllib; print(json.dumps(tomllib.load(open(sys.argv[1], "rb"))))
          - "{{ render_dir }}/nucleated-config.toml"
      register: render_daemon
      changed_when: false

    - name: Check it against the settings
      ansible.builtin.assert:
        that:
          - render_config.target == watch_target
          - render_config.environment | map(attribute='name') | list == environments | map(attribute='name') | list
          - ('ups' in render_config) == (nut_enabled | bool)
          - not (nut_enabled | bool) or render_config.ups.name == ups_name ~ '@localhost'
          - ('notify' in render_config) == (box_notify_url | length > 0)
          - box_notify_url | length == 0 or render_config.notify.url == box_notify_url
          - box_notify_url | length == 0 or ('token_file' in render_config.notify) == (secret_refs.box_notify_token | length > 0)
        quiet: true
      vars:
        render_config: "{{ render_daemon.stdout | from_json }}"

    - name: Render each agent server's settings and its Claude Code settings
      ansible.builtin.template:
        src: "{{ outer.1.src }}"
        dest: "{{ render_dir }}/{{ outer.0.name }}.{{ outer.1.dest }}"
        mode: "0600"
      vars:
        env: "{{ outer.0 }}"
      loop: "{{ environments | product(render_per_server) }}"
      loop_control:
        loop_var: outer
        label: "{{ outer.0.name }}.{{ outer.1.dest }}"

    # The sandbox must be on, required, and offer no way around it: an agent
    # whose sandbox fails must stop, not retry the command unconfined.
    - name: Check each Claude Code settings file keeps commands in the sandbox
      ansible.builtin.assert:
        that:
          - render_sandbox.enabled is sameas true
          - render_sandbox.failIfUnavailable is sameas true
          - render_sandbox.allowUnsandboxedCommands is sameas false
        quiet: true
      vars:
        render_sandbox: "{{ (lookup('ansible.builtin.file', render_dir ~ '/' ~ item.name ~ '.settings.json') | from_json).sandbox }}"
      loop: "{{ environments }}"
      loop_control:
        label: "{{ item.name }}.settings.json"

    - name: Render the closing message
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', '../templates/next-steps.j2') }}"
        dest: "{{ render_dir }}/next-steps.txt"
        mode: "0600"

    - name: Record the values the roles derive
      ansible.builtin.copy:
        content: |
          nucleate_url: {{ workspace_nucleate_url }}
          day2_claude_dirs: {{ day2_claude_dirs | join(' ') }}
          clone_urls: {% for item in repos %}https://github.com/{{ item if '/' in item else github_org ~ '/' ~ item }}.git -> .repos/{{ item | basename }}.git {% endfor %}

        dest: "{{ render_dir }}/derived.txt"
        mode: "0600"
