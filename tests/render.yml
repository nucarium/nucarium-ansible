---
# Renders every template against the example settings, on your workstation,
# into out/render/. Nothing connects to a box.
#
#   ansible-playbook tests/render.yml
#   ansible-playbook tests/render.yml -e @tests/two-logins.yml
#   ansible-playbook tests/render.yml -e @tests/three-networks.yml
- name: Render the templates locally
  hosts: boxes
  connection: local
  gather_facts: false
  become: false
  vars_files:
    - ../roles/workspace/vars/main.yml
    - ../roles/claude/vars/main.yml
    - ../roles/day2/vars/main.yml
    - ../roles/env_setup/vars/main.yml
    - ../vars/sandbox.yml
  vars:
    render_dir: "{{ playbook_dir }}/../out/render"
    agent_home: /home/{{ agent_user }}
    agent_uid: "1001"
    nucleus_root: "{{ agent_home }}/workspace"
    env_config_dir: "{{ env.config_dir | default(agent_home ~ '/.claude') }}"
    env_claude: "{{ {} if env_config_dir == agent_home ~ '/.claude' else {'CLAUDE_CONFIG_DIR': env_config_dir} }}"
    env_network: "{{ env.network | default('limited', true) }}"
    env_allowed_hosts: "{{ env.allowed_hosts | default([], true) }}"
    env_variables: "{{ env.variables | default({}, true) }}"
    env_setup_script: "{{ env.setup_script | default('', true) }}"
    watch_console_url: https://app.nucarium.com
    render_per_server:
      - src: ../roles/agent_servers/templates/agent-server.env.j2
        dest: env
      - src: ../roles/claude/templates/settings.json.j2
        dest: settings.json
      - src: ../roles/env_setup/templates/variables.sh.j2
        dest: variables.sh
    # Stand-ins for values the real run reads from the box.
    nut_password:
      content: "{{ 'example-monitor-password' | b64encode }}"
  tasks:
    # The same check site.yml makes first. scripts/check also runs this
    # playbook with entries it must refuse.
    - name: Check each environment's settings
      ansible.builtin.import_tasks: ../tasks/check-environments.yml

    - name: Start from an empty folder
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: "{{ item }}"
        mode: "0700"
      loop:
        - absent
        - directory

    - name: Render the templates that are the same for every agent server
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0600"
      loop:
        - src: ../roles/day2/templates/nucleated-config.toml.j2
          dest: nucleated-config.toml
        - src: ../roles/workspace/templates/nucleate-config.toml.j2
          dest: nucleate-config.toml
        - src: ../roles/agent_servers/templates/agents.slice.j2
          dest: agents.slice
        - src: ../roles/day2/templates/agent-backup.service.j2
          dest: agent-backup.service
        - src: ../roles/broker/templates/agent-github-token.j2
          dest: agent-github-token
        - src: ../roles/broker/templates/agent-hcp-token.j2
          dest: agent-hcp-token
        - src: ../roles/nut/templates/ups.conf.j2
          dest: ups.conf
        - src: ../roles/nut/templates/upsd.users.j2
          dest: upsd.users
        - src: ../roles/nut/templates/upsmon.conf.j2
          dest: upsmon.conf
        - src: ../roles/env_setup/templates/nucarium-env-setup@.service.j2
          dest: nucarium-env-setup@.service
      loop_control:
        label: "{{ item.dest }}"

    # The daemon's configuration is the one file here another program parses,
    # so it is read back the way the daemon reads it: as TOML. It must say
    # what the settings ask for and nothing they do not.
    - name: Read the daemon's configuration back as TOML
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -c
          - import json, sys, tomllib; print(json.dumps(tomllib.load(open(sys.argv[1], "rb"))))
          - "{{ render_dir }}/nucleated-config.toml"
      register: render_daemon
      changed_when: false

    - name: Check it against the settings
      ansible.builtin.assert:
        that:
          - render_config.target == watch_target
          - render_config.environment | map(attribute='name') | list == environments | map(attribute='name') | list
          - ('ups' in render_config) == (nut_enabled | bool)
          - not (nut_enabled | bool) or render_config.ups.name == ups_name ~ '@localhost'
          - ('notify' in render_config) == (box_notify_url | length > 0)
          - box_notify_url | length == 0 or render_config.notify.url == box_notify_url
          - box_notify_url | length == 0 or ('token_file' in render_config.notify) == (secret_refs.box_notify_token | length > 0)
        quiet: true
      vars:
        render_config: "{{ render_daemon.stdout | from_json }}"

    - name: Render each agent server's settings and its Claude Code settings
      ansible.builtin.template:
        src: "{{ outer.1.src }}"
        dest: "{{ render_dir }}/{{ outer.0.name }}.{{ outer.1.dest }}"
        mode: "0600"
      vars:
        env: "{{ outer.0 }}"
      loop: "{{ environments | product(render_per_server) }}"
      loop_control:
        loop_var: outer
        label: "{{ outer.0.name }}.{{ outer.1.dest }}"

    # The sandbox must be on, required, and offer no way around it: an agent
    # whose sandbox fails must stop, not retry the command unconfined. Agents
    # may write only the folders named in vars/sandbox.yml, the nucleus, the
    # temp folders and pnpm's lock folders: never the home itself, its
    # dotfiles, the folders on their PATH, nor the bare repositories' hooks
    # and config. With network limited they reach every host a cloud session
    # reaches by default and the environment's own; with full, any host; with
    # none, no host, refused rather than asked about.
    - name: Check each Claude Code settings file keeps commands in the sandbox
      ansible.builtin.assert:
        that:
          - render_sandbox.enabled is sameas true
          - render_sandbox.failIfUnavailable is sameas true
          - render_sandbox.allowUnsandboxedCommands is sameas false
          - render_sandbox.filesystem.allowWrite == [nucleus_root] + (sandbox_agent_dirs | map('regex_replace', '^', '~/') | list) + ['/tmp', '/var/tmp'] + claude_pnpm_lock_dirs
          - render_sandbox.filesystem.allowWrite | select('match', '^~/?$') | list | length == 0
          - render_sandbox.filesystem.allowWrite | select('match', '^~/[.]?(bashrc|profile|gitconfig|npmrc|claude|claude[.]json|docker|ssh|local/bin|local/share/fnm|config)$') | list | length == 0
          - claude_pnpm_lock_dirs | select('match', '^/run/user/' ~ agent_uid ~ '/pnpm-') | list | length == 3
          - "['~/go/bin', '~/.cargo/bin', '~/.cargo/config.toml', '~/.local/state/nucleated'] | difference(render_sandbox.filesystem.denyWrite) | length == 0"
          - render_sandbox.filesystem.denyWrite | select('search', '/[.]repos/') | list | length == 2 * (repos | length)
          - render_sandbox.excludedCommands | sort == ['docker', 'podman']
          - render_bare | map('regex_replace', '$', '/hooks') | difference(render_sandbox.filesystem.denyWrite) | length == 0
          - render_bare | map('regex_replace', '$', '/config') | difference(render_sandbox.filesystem.denyWrite) | length == 0
          - env_network in ['none', 'limited', 'full']
          - "env_network != 'limited' or ['api.anthropic.com', 'registry.npmjs.org', 'pypi.org', 'crates.io', 'proxy.golang.org', 'repo1.maven.org', 'registry-1.docker.io', 'archive.ubuntu.com', '*.githubusercontent.com'] | difference(render_network.allowedDomains) | length == 0"
          - env_network != 'limited' or sandbox_extra_allowed_domains | default([]) | difference(render_network.allowedDomains) | length == 0
          - env_network != 'limited' or env_allowed_hosts | difference(render_network.allowedDomains) | length == 0
          - env_network != 'limited' or render_network.allowedDomains | length == render_network.allowedDomains | unique | length
          - env_network != 'limited' or '*' not in render_network.allowedDomains
          - env_network != 'limited' or render_network.keys() | list == ['allowedDomains']
          - "env_network != 'full' or render_network == {'allowedDomains': ['*']}"
          - "env_network != 'none' or render_network == {'allowedDomains': [], 'strictAllowlist': true}"
          - render_settings.hooks.SessionStart[0].hooks[0].command == '$HOME/.claude/hooks/session-env.sh ' ~ env.name
        quiet: true
      vars:
        render_settings: "{{ lookup('ansible.builtin.file', render_dir ~ '/' ~ env.name ~ '.settings.json') | from_json }}"
        render_sandbox: "{{ render_settings.sandbox }}"
        render_network: "{{ render_sandbox.network }}"
        render_bare: "{{ repos | map('basename') | map('regex_replace', '^(.*)$', nucleus_root ~ '/.repos/\\1.git') | list }}"
      loop: "{{ environments }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.settings.json"

    # Read back the way the session reads them: sourced by bash. Every value
    # must arrive exactly as written in the settings, spaces, quotes, $,
    # backslashes and newlines included.
    - name: Source each environment's variables in bash
      ansible.builtin.command:
        argv: "{{ ['bash', '-c', render_source, ansible_playbook_python, render_dir ~ '/' ~ env.name ~ '.variables.sh'] + env_variables.keys() | list }}"
      vars:
        # Sources the file, then prints the named variables as JSON.
        render_source: >-
          set -eu; . "$1"; shift;
          exec "$0" -c 'import json, os, sys; print(json.dumps({n: os.environ.get(n) for n in sys.argv[1:]}))' "$@"
      environment:
        PATH: /usr/bin:/bin
      loop: "{{ environments }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.variables.sh"
      register: render_sourced
      changed_when: false

    - name: Check each variable arrives intact
      ansible.builtin.assert:
        that:
          - render_written.keys() | map('extract', item.stdout | from_json) | list == render_written.values() | list
        quiet: true
      vars:
        render_written: "{{ item.env.variables | default({}, true) }}"
      loop: "{{ render_sourced.results }}"
      loop_control:
        label: "{{ item.env.name }}.variables.sh"

    # The script as the env_setup role stores it, from the same expression:
    # text that looks like a template ({{, {% or {#) is kept as written.
    - name: Store each environment's setup script
      ansible.builtin.copy:
        content: "{{ env_setup_script }}"
        dest: "{{ render_dir }}/{{ env.name }}.setup.sh"
        mode: "0600"
      loop: "{{ environments | selectattr('setup_script', 'defined') | selectattr('setup_script') | list }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.setup.sh"

    - name: Check each stored script is the one in the settings
      ansible.builtin.assert:
        that:
          - render_stored == env.setup_script
          - render_expected_setup_scripts is not defined or render_stored == render_expected_setup_scripts[env.name]
        quiet: true
      vars:
        render_stored: "{{ lookup('ansible.builtin.file', render_dir ~ '/' ~ env.name ~ '.setup.sh', rstrip=false) }}"
      loop: "{{ environments | selectattr('setup_script', 'defined') | selectattr('setup_script') | list }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.setup.sh"

    # What nucleated reads and reports: exactly these six keys, with these
    # types, and counts rather than values.
    - name: Write each environment's summary
      ansible.builtin.copy:
        content: "{{ env_setup_summary | to_nice_json }}\n"
        dest: "{{ render_dir }}/{{ env.name }}.summary.json"
        mode: "0600"
      loop: "{{ environments }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.summary.json"

    - name: Check each summary
      ansible.builtin.assert:
        that:
          - render_summary.keys() | sort == ['allowed_hosts', 'network', 'repos', 'secrets', 'setup_script', 'variables']
          - render_summary.network == env_network
          - render_summary.allowed_hosts is integer and render_summary.allowed_hosts is not boolean
          - render_summary.allowed_hosts == (env_allowed_hosts | length if env_network == 'limited' else 0)
          - render_summary.repos == repos | map('regex_replace', '^([^/]+)$', github_org ~ '/\\1') | list
          - render_summary.variables is integer and render_summary.variables is not boolean
          - render_summary.variables == env_variables | length
          - render_summary.secrets == 0 and render_summary.secrets is not boolean
          - render_summary.setup_script is boolean
          - render_summary.setup_script == (env.setup_script | default('', true) | length > 0)
          - render_expected_summaries is not defined or render_summary == render_expected_summaries[env.name]
        quiet: true
      vars:
        render_summary: "{{ lookup('ansible.builtin.file', render_dir ~ '/' ~ env.name ~ '.summary.json') | from_json }}"
      loop: "{{ environments }}"
      loop_control:
        loop_var: env
        label: "{{ env.name }}.summary.json"

    - name: Check the setup-script unit
      ansible.builtin.assert:
        that:
          - "'Type=oneshot' in render_unit"
          - "'RemainAfterExit=yes' in render_unit"
          - "'ExecStart=/usr/local/sbin/nucarium-env-setup %i' in render_unit"
          - "('Environment=NUCLEUS_ROOT=' ~ nucleus_root) in render_unit"
          - "'WantedBy=multi-user.target' in render_unit"
          - render_unit | select('match', '(Requires|BindsTo|PartOf)=') | list | length == 0
        quiet: true
      vars:
        render_unit: "{{ lookup('ansible.builtin.file', render_dir ~ '/nucarium-env-setup@.service').split('\n') }}"

    - name: Render the closing message
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.template', '../templates/next-steps.j2') }}"
        dest: "{{ render_dir }}/next-steps.txt"
        mode: "0600"

    - name: Record the values the roles derive
      ansible.builtin.copy:
        content: |
          nucleate_url: {{ workspace_nucleate_url }}
          day2_claude_dirs: {{ day2_claude_dirs | join(' ') }}
          clone_urls: {% for item in repos %}https://github.com/{{ item if '/' in item else github_org ~ '/' ~ item }}.git -> .repos/{{ item | basename }}.git {% endfor %}

        dest: "{{ render_dir }}/derived.txt"
        mode: "0600"
