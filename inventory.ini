# One line per box, under [boxes]:
#
#   <name> ansible_host=<address> ansible_user=<your user on the box>
#
# <name> becomes the box's hostname, its Tailscale name and its machine name
# in Nucarium Watch. Use lower-case letters, digits and hyphens.
#
# ansible_host is the box's address on your network, needed for the first
# run only. Once Tailscale is up, remove it and the name resolves through
# MagicDNS. ansible_user is the same value as operator_user in
# group_vars/all.yml.
[boxes]
agentbox ansible_host=192.168.1.50 ansible_user=ops
